=# K1C
# Printer_size: 220x220x250
# Version: v2.0.11
# CreateDate: 2023/09/05

# =============================================================================
# INCLUDES
# =============================================================================
[include sensorless.cfg]
[include gcode_macro.cfg]
[include printer_params.cfg]
[include zoffset-guppy.cfg]
[include Helper-Script/git-backup.cfg]
[include GuppyScreen/*.cfg]
[include Dummy_M191.cfg]
[include custom_purge.cfg]
[include M600-support-custom.cfg]

# =============================================================================
# RESPOND (global — only one [respond] across all included files)
# =============================================================================
[respond]
default_type: echo
default_prefix:

# =============================================================================
# HARDWARE
# =============================================================================
[mcu]
serial: /dev/ttyS7
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS1
baud: 230400
restart_method: command

[mcu leveling_mcu]
serial: /dev/ttyS9
baud: 230400
restart_method: command

[mcu rpi]
serial: /tmp/klipper_host_mcu

[bl24c16f]
i2c_mcu: rpi
i2c_bus: i2c.2
i2c_speed: 400000

# =============================================================================
# HEATER VERIFICATION
#
# FIX #4 — Both sections now have identical, relaxed parameters.
#
# Klipper's built-in defaults (check_gain_time 20s, heating_gain 2.0) are
# aggressive enough that heating a K1C nozzle from cold can occasionally
# trip a false "Heater extruder not heating at expected rate" error.
# Matching the bed's relaxed values eliminates those false trips while
# still catching real faults (open heater, thermistor failure, etc.).
#
# The running printer.cfg only had the bed params set. The extruder
# section was empty — the log confirmed this. Both are now populated.
# =============================================================================
[verify_heater extruder]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

# =============================================================================
# VIRTUAL SDCARD & GCODE
# =============================================================================
[virtual_sdcard]
path: /usr/data/printer_data/gcodes

[gcode_arcs]
resolution: 1.0

# =============================================================================
# TEMPERATURE SENSORS
# =============================================================================
[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor chamber_temp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 125

# =============================================================================
# STEPPERS
# =============================================================================
[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 229
position_min: -5
position_max: 229
homing_speed: 30
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PA9
interpolate: True
run_current: 1.2
sense_resistor: 0.100
stealthchop_threshold: 0
uart_address: 3
diag_pin: ^PB12
driver_SGTHRS: 75

[stepper_y]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PC3
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -0.5
position_min: -0.5
position_max: 227
homing_speed: 30
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PA10
interpolate: True
run_current: 1.2
sense_resistor: 0.100
stealthchop_threshold: 0
uart_address: 3
diag_pin: ^PB13
driver_SGTHRS: 75

# -----------------------------------------------------------------------------
# FIX #22 — [stepper_z] now has explicit Z homing speeds.
#
# The running config had neither homing_speed nor second_homing_speed on Z.
# Klipper defaulted to values that are too fast for a leadscrew with a 64:20
# gear ratio and frequently caused audible grinding on the second approach.
# The log showed Klipper using defaults. Now explicit:
#   homing_speed: 10         (first approach — fast)
#   second_homing_speed: 2   (final approach — slow, accurate)
# -----------------------------------------------------------------------------
[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
gear_ratio: 64:20
endstop_pin: tmc2209_stepper_z:virtual_endstop
position_endstop: 0
position_max: 255
position_min: -5
homing_speed: 10
second_homing_speed: 2

[tmc2209 stepper_z]
uart_pin: PA11
uart_address: 3
run_current: 0.8
diag_pin: ^PB14
stealthchop_threshold: 0
sense_resistor: 0.100
driver_SGTHRS: 0

[extruder]
max_extrude_only_distance: 1000.0
max_extrude_cross_section: 80
step_pin: nozzle_mcu:PB1
dir_pin: nozzle_mcu:PB0
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu:PA0
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040
#control: pid
#pid_Kp: 25.013
#pid_Ki: 2.566
#pid_Kd: 60.966
min_temp: 0
max_temp: 320

[tmc2209 extruder]
uart_pin: nozzle_mcu:PB11
tx_pin: nozzle_mcu:PB10
uart_address: 3
run_current: 0.55
sense_resistor: 0.150
stealthchop_threshold: 0

# -----------------------------------------------------------------------------
# FIX #23 — [heater_bed] heater_pin confirmed.
#
# The running config and factory backup both show PB10 on this board revision.
# Verified working: the log shows bed temperature reading normally and PID
# control engaged. No change needed. If your board revision differs, verify
# against the schematic before changing.
# -----------------------------------------------------------------------------
[heater_bed]
heater_pin: PB10
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: watermark
#control: pid
#pid_kp: 27
#pid_ki: 0.08
#pid_kd: 0
min_temp: 0
max_temp: 125

# =============================================================================
# FANS
# =============================================================================
[multi_pin heater_fans]
pins: nozzle_mcu:PB5

[heater_fan hotend_fan]
pin: multi_pin:heater_fans
heater: extruder
heater_temp: 40

[static_digital_output my_fan_output_pins]
pins: nozzle_mcu:PB6

[output_pin fan0]
pin: !nozzle_mcu:PB8
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin fan1]
pin: PC0
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin fan2]
pin: PB1
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin LED]
pin: PB0
pwm: True
cycle_time: 0.010
value: 1

# =============================================================================
# ADXL345 & RESONANCE TESTER
# =============================================================================
[adxl345]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: x,-z,y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 60
probe_points:
    110,110,10

# =============================================================================
# PRTOUCH V2 (K1 series)
# =============================================================================
[prtouch_v2]
pr_version: 1
step_base: 2
#z_offset: 0
noz_ex_com: 0.06
tilt_corr_dis: 0
tri_min_hold: 2500,20000
tri_max_hold: 6000,60000
pres_cnt: 4
pres0_clk_pins: leveling_mcu:PA5
pres0_sdo_pins: leveling_mcu:PA1
pres1_clk_pins: leveling_mcu:PA2
pres1_sdo_pins: leveling_mcu:PA0
pres2_clk_pins: leveling_mcu:PA6
pres2_sdo_pins: leveling_mcu:PA3
pres3_clk_pins: leveling_mcu:PA7
pres3_sdo_pins: leveling_mcu:PA4
show_msg: False
step_swap_pin: PC10
pres_swap_pin: leveling_mcu:PB1
g28_wait_cool_down: true
pa_clr_down_mm: -0.15
clr_noz_start_x: 87
clr_noz_start_y: 225
clr_noz_len_x: 46
clr_noz_len_y: 1
speeds: 2.5,1.0
tri_hftr_cut: 2,1
tri_lftr_k1: 0.70,0.30
tri_try_max_times: 10
clr_noz_quick: true
clr_quick_high: 0.2
clr_xy_quick_spd: 100
clr_quick_times: 10
clr_quick_react_dis: 5

# =============================================================================
# BED MESH
# =============================================================================
[bed_mesh]
speed: 150
mesh_min: 5,5
mesh_max: 215,215
probe_count: 5,5
fade_start: 5.0
fade_end: 50.0

[display_status]

# =============================================================================
# SKEW CORRECTION
# =============================================================================
[skew_correction]

# =============================================================================
# PRINTER
#
# FIX #6 — square_corner_max_velocity kept commented out.
#
# If Klipper still loads it (check with the verify command below), the value
# is coming from an included file (likely GuppyScreen or a Helper-Script).
# Search:  grep -rn "square_corner_max_velocity" /usr/data/printer_data/config/
# The log confirmed it was loaded as 200.0 in your previous boot, which means
# a file other than this one is defining it, OR the on-disk copy of this file
# differs from what was shown earlier in the conversation.
# =============================================================================
[printer]
kinematics: corexy
max_velocity: 800
max_accel: 10000
max_accel_to_decel: 5000
max_z_velocity: 10
square_corner_velocity: 5.0
max_z_accel: 300
#square_corner_max_velocity: 200.0

[pause_resume]
[exclude_object]

