# =============================================================================
# Creality K1C - Klipper Printer Configuration
# REV 2026-10-22 (v12) - bulletproof inline CLEAR_NOZZLE_QUICK
#
# Changes from v11:
#   * CLEAR_NOZZLE_QUICK is now INLINED below, not loaded via include.
#     The include mechanism failed 5 times on this firmware.
#   * rename_existing: CLEAR_NOZZLE_QUICK_ORIGINAL removed - Creality
#     [prtouch_v2] does not register CLEAR_NOZZLE_QUICK_ORIGINAL on this
#     firmware, so the rename had no target and the macro was silently
#     dropped. Inline with no rename = guaranteed registration.
#   * clr_noz_quick set to false in [prtouch_v2] to avoid any future
#     duplicate-macro conflict.
#   * TMC X/Y run_current 1.1 A (OTPW fix), g28_ext_temp 180 (CX_ROUGH
#     minimum), all v11 fixes retained.
# =============================================================================

[include k1c_compat.cfg]
[include custom_purge.cfg]
[include zoffset-guppy.cfg]
[include k1c_chamber_overrides.cfg]

# Optional skew calibration - uncomment if skew_calibration_macros.cfg exists
# [include skew_calibration_macros.cfg]

[custom_macro]
default_bed_temp: 50
default_extruder_temp: 240
g28_ext_temp: 180

[mcu]
serial: /dev/ttyS7
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS1
baud: 230400
restart_method: command

[mcu leveling_mcu]
serial: /dev/ttyS9
baud: 230400
restart_method: command

[mcu rpi]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
max_accel_to_decel: 20000
max_z_velocity: 10
max_z_accel: 300
square_corner_velocity: 5.0
square_corner_max_velocity: 200.0

[force_move]
enable_force_move: true

[gcode_arcs]
resolution: 1.0

[input_shaper]
shaper_type_x: 2hump_ei
shaper_freq_x: 65.8
shaper_type_y: zv
shaper_freq_y: 61.8

[respond]

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 32
rotation_distance: 39.920
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 229
position_min: -5
position_max: 229
homing_speed: 30
homing_retract_dist: 0

[stepper_y]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PC3
microsteps: 32
rotation_distance: 39.920
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -0.5
position_min: -0.5
position_max: 227
homing_speed: 30
homing_retract_dist: 0

[stepper_z]
step_pin: PB6
