variable_fan1_speed: 0
variable_fan2_speed: 0
variable_fan0_min: 0
variable_fan1_min: 0
variable_fan2_min: 0
gcode:

[gcode_macro Qmode]
variable_flag: 0
variable_max_accel: 15000
variable_max_velocity: 600
variable_max_z_velocity: 10
variable_max_accel_to_decel: 7500
variable_fan0_value: 0
variable_fan1_value: 0
variable_fan2_value: 0
gcode:

[gcode_macro CUSTOM_DEFAULTS]
variable_default_bed_temp: 50.0
variable_default_extruder_temp: 240.0
variable_g28_ext_temp: 180.0
gcode:

[gcode_macro M300]
gcode:

# -----------------------------------------------------------------------------
# START_PRINT - v13.6 MINIMAL
#
# No complex parsing. Every { ... } expression is single-line. Every
# {%...%} block is simple. Nothing here can trigger the Klipper regex
# bug or a Jinja parse error.
#
# Flow:
#   1. ZOFFSET_UNSUPPRESS (safety: clear any stuck suppress_save from a
#      prior aborted START_PRINT)
#   2. Parse BED_TEMP, EXTRUDER_TEMP, FILAMENT_TYPE from params
#   3. Set chamber fan target from filament type
#   4. Heat to 180C (probe-safe), home, clean, full bed mesh
#   5. Heat to print temp, purge, restore Z-offset
#
# No thermal_comp. Saved offset == live offset after ZOFFSET_RESTORE.
# Re-tune the saved offset once at your normal print temperature.
# No adaptive mesh - full bed mesh only. Adaptive will be added later.
# -----------------------------------------------------------------------------
[gcode_macro START_PRINT]
variable_prepare: 0
gcode:
  SAVE_GCODE_STATE NAME=START_PRINT_state
  ZOFFSET_UNSUPPRESS
  G92 E0
  M400
  WAIT_TEMP_END
  CLEAR_PAUSE

  {% set bed_temp = 50.0 %}
  {% if 'BED_TEMP' in params %}
    {% set bed_temp = params.BED_TEMP|float(50.0) %}
  {% endif %}

  {% set extruder_temp = 240.0 %}
  {% if 'EXTRUDER_TEMP' in params %}
    {% set extruder_temp = params.EXTRUDER_TEMP|float(240.0) %}
  {% endif %}

  {% set ftype = params.FILAMENT_TYPE|default("")|upper %}

  {action_respond_info("START_PRINT BED=%s HOTEND=%s" % (bed_temp, extruder_temp))}
  {action_respond_info("Filament: %s" % ftype)}

  {% if "ABS" in ftype or "ASA" in ftype %}
    M141 S55
  {% elif "PLA" in ftype or "TPU" in ftype or "PVA" in ftype %}
    M141 S25
  {% else %}
    M141 S35
  {% endif %}

  M140 S{bed_temp}
  M104 S180
  M190 S{bed_temp}
  M109 S180

  ZOFFSET_CLEAR

  CX_ROUGH_G28 EXTRUDER_TEMP=180 BED_TEMP={bed_temp}
  CX_NOZZLE_CLEAR
  ACCURATE_G28
  CX_PRINT_LEVELING_CALIBRATION

  {% if printer.toolhead.homed_axes != "xyz" %}
    G28
    {% if 'default' in printer.bed_mesh.profiles %}
      BED_MESH_PROFILE LOAD="default"
    {% endif %}
  {% endif %}

  M109 S{extruder_temp}
  G92 E0
  M400
  _CUSTOM_PURGE_LINE
  M400

  RESTORE_GCODE_STATE NAME=START_PRINT_state
  ZOFFSET_RESTORE

[gcode_macro END_PRINT]
description: Safe end-of-print cleanup
gcode:
  SAVE_GCODE_STATE NAME=END_PRINT_state
  TURN_OFF_HEATERS
  M141 S0
  M106 P0 S0
  M106 P2 S0
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G92 E0
    G1 E-2 F1800
    M400
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    G1 Z10 F600
    M400
    G90
    G1 X10 Y10 F6000
    M400
  {% endif %}
  BED_MESH_CLEAR
  _SET_GCODE_OFFSET Z=0 MOVE=0
  ZOFFSET_UNSUPPRESS
  M84
  RESPOND TYPE=command MSG="Print complete"
  RESTORE_GCODE_STATE NAME=END_PRINT_state

[gcode_macro CX_NOZZLE_CLEAR]
rename_existing: CX_NOZZLE_CLEAR_ORIGINAL
description: Nozzle cleaning routine
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  {% set start_x = 90 %}
  {% set start_y = 226 %}
  {% set start_z = 3.8 %}
  {% set wipe_dist = 40 %}
  {% set wipe_qty = 10 %}
  {% set wipe_spd = 250 %}
  {% set raise_distance = 15 %}
  G90
  G1 X{start_x} Y{start_y} F6000
  G1 Z{start_z} F1500
  {% for wipes in range(1, (wipe_qty + 1)) %}
    G1 X{start_x + wipe_dist} F{wipe_spd * 60}
    G1 X{start_x} F{wipe_spd * 60}
  {% endfor %}
  G1 Z{raise_distance} F1500

[gcode_macro CLEAR_NOZZLE_QUICK]
description: Custom nozzle clean on rear silicone brush
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  {% set brush_x = 87 %}
  {% set brush_y = 225 %}
  {% set wipe_len = 46 %}
  {% set wipe_z = 3.8 %}
  {% set passes = 6 %}
  {% set feed_xy = 3000 %}
  {% set feed_z = 500 %}
  G90
  G1 Z5 F600
  G1 X{brush_x} Y{brush_y} F6000
  G1 Z{wipe_z} F{feed_z}
  {% for i in range(passes) %}
    G1 X{brush_x + wipe_len} F{feed_xy}
    G1 X{brush_x} F{feed_xy}
  {% endfor %}
