# =============================================================================
# Creality K1C - Klipper Printer Configuration
# REV 2026-10-26 (v13.6) - MINIMAL START_PRINT - thermal_comp removed
#
# WHY v13.5:
#   * v13.4 had a template syntax error at START_PRINT line 13.
#     Most likely a corrupted upload (smart quote, mangled line, or
#     partial overwrite). Rather than debug the complex parsing in v13.4,
#     v13.5 uses a minimal, unbreakable START_PRINT.
#   * NO complex Jinja chains, NO multi-line { } expressions,
#     NO { or } characters inside {%...%} blocks, NO .replace() tricks.
#   * Adaptive mesh disabled for now. Full bed mesh only.
#     Adaptive mesh will be added back as a separate, tested change.
#
# Chamber fan (inlined - no macro call):
#   ABS / ASA         -> M141 S55 (chamber warms, vent if > 55)
#   PLA / TPU / PVA   -> M141 S25 (vent to ambient)
#   Everything else   -> M141 S35 (moderate vent, PETG default)
#
# Orca start gcode (no MESH_MIN/MESH_MAX - those caused / errors):
#   M104 S0
#   M140 S0
#   G92 E0
#   START_PRINT EXTRUDER_TEMP=[nozzle_temperature_initial_layer] BED_TEMP=[bed_temperature_initial_layer_single] FILAMENT_TYPE=[filament_type[0]]
#
# RULES FOR THIS FILE:
#   - No { or } inside {%...%} (breaks Klipper regex)
#   - No backticks anywhere (breaks Jinja template)
#   - No prose in #*# SAVE_CONFIG block (breaks configparser)
#   - No multi-line { ... } expressions (breaks Jinja compile)
# =============================================================================
# WHY v13.6:
#   * Removed thermal_comp (the Z_ADJUST=(extruder_temp - 180) * 0.000465
#     line). It made live != saved by 0.028mm at 240C, so Guppy Screen
#     and the nozzle disagreed, and any absolute SET_GCODE_OFFSET Z=
#     wiped it while the saved value did not. After removal, saved == live
#     exactly. Re-tune the saved offset once at your normal print temp.
#   * Added ZOFFSET_UNSUPPRESS at the top of START_PRINT so a crash
#     between ZOFFSET_CLEAR and ZOFFSET_RESTORE cannot leave suppress_save=1.
# =============================================================================

[include k1c_compat.cfg]
[include custom_purge.cfg]
[include zoffset-guppy.cfg]
[include k1c_chamber_overrides.cfg]

[custom_macro]
default_bed_temp: 50
default_extruder_temp: 240
g28_ext_temp: 180

[mcu]
serial: /dev/ttyS7
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS1
baud: 230400
restart_method: command

[mcu leveling_mcu]
serial: /dev/ttyS9
baud: 230400
restart_method: command

[mcu rpi]
serial: /tmp/klipper_host_mcu

[force_move]
enable_force_move: true

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
max_accel_to_decel: 20000
max_z_velocity: 10
max_z_accel: 300
square_corner_velocity: 5.0
square_corner_max_velocity: 200.0

[input_shaper]
shaper_type_x: 2hump_ei
shaper_freq_x: 65.8
shaper_type_y: zv
shaper_freq_y: 61.8

[respond]

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 32
rotation_distance: 39.920
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 229
position_min: -5
position_max: 229
homing_speed: 30
homing_retract_dist: 0

[stepper_y]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PC3
microsteps: 32
rotation_distance: 39.920
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -0.5
position_min: -0.5
position_max: 227
homing_speed: 30
homing_retract_dist: 0

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
gear_ratio: 64:20
endstop_pin: tmc2209_stepper_z:virtual_endstop
position_endstop: 0
position_max: 255
position_min: -5

[tmc2209 stepper_x]
uart_pin: PA9
interpolate: True
run_current: 1.1
sense_resistor: 0.100
stealthchop_threshold: 0
uart_address: 3
diag_pin: ^PB12
driver_sgthrs: 75

[tmc2209 stepper_y]
uart_pin: PA10
interpolate: True
run_current: 1.1
sense_resistor: 0.100
stealthchop_threshold: 0
uart_address: 3
diag_pin: ^PB13
driver_sgthrs: 75

[tmc2209 stepper_z]
uart_pin: PA11
uart_address: 3
run_current: 0.8
diag_pin: ^PB14
stealthchop_threshold: 0
sense_resistor: 0.100
driver_sgthrs: 0

[extruder]
max_extrude_only_distance: 1000.0
max_extrude_cross_section: 80
step_pin: nozzle_mcu:PB1
dir_pin: nozzle_mcu:PB0
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu:PA0
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040
control: pid
pid_kp: 25.013
pid_ki: 2.566
pid_kd: 60.966
min_temp: 0
max_temp: 320

[tmc2209 extruder]
uart_pin: nozzle_mcu:PB11
tx_pin: nozzle_mcu:PB10
uart_address: 3
run_current: 0.55
sense_resistor: 0.150
stealthchop_threshold: 0

[heater_bed]
heater_pin: PB10
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: watermark
min_temp: 0
max_temp: 115

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[duplicate_pin_override]
pins: PC0, PC5, PB2, PC6

[multi_pin heater_fans]
pins: nozzle_mcu:PB5,PB2

[heater_fan hotend_fan]
pin: multi_pin:heater_fans
heater: extruder
heater_temp: 40

[static_digital_output my_fan_output_pins]
pins: nozzle_mcu: PB6

[output_pin fan0]
pin: !nozzle_mcu: PB8
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin fan2]
pin: PB1
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin LED]
pin: PB0
pwm: True
cycle_time: 0.010
value: 1

[gcode_macro M106]
description: Fan control
gcode:
  {% if params.P is defined and (params.P|int == 1 or params.P|int == 3) %}
    {% if params.S is defined and params.S|float > 0 %}
      M141 S50
    {% else %}
      M141 S0
    {% endif %}
  {% else %}
    {% set fans = printer["gcode_macro PRINTER_PARAM"].fans|int %}
    {% set fan = 0 %}
    {% set value = 0 %}
    {% if params.P is defined %}
      {% set tmp = params.P|int %}
      {% if tmp < fans %}
        {% set fan = tmp %}
      {% endif %}
    {% endif %}
    {% if params.S is defined %}
      {% set tmp = params.S|float %}
    {% else %}
      {% set tmp = 255 %}
    {% endif %}
    {% if tmp > 0 %}
      {% if fan == 0 %}
        {% set value = (255 - printer["gcode_macro PRINTER_PARAM"].fan0_min) / 255 * tmp %}
        {% if printer['gcode_macro Qmode'].flag | int == 1 %}
          SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan0_value VALUE={printer["gcode_macro PRINTER_PARAM"].fan0_min + value}
          {% if value > (255 - printer['gcode_macro PRINTER_PARAM'].fan0_min) / 2 %}
            {% set value = printer["gcode_macro PRINTER_PARAM"].fan0_min + (255 - printer['gcode_macro PRINTER_PARAM'].fan0_min) / 2 %}
          {% else %}
            {% set value = printer["gcode_macro PRINTER_PARAM"].fan0_min + value %}
          {% endif %}
        {% else %}
          {% set value = printer["gcode_macro PRINTER_PARAM"].fan0_min + value %}
        {% endif %}
      {% endif %}
      {% if fan == 2 %}
        {% set value = (255 - printer["gcode_macro PRINTER_PARAM"].fan2_min) / 255 * tmp %}
        {% if printer['gcode_macro Qmode'].flag | int == 1 %}
          SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan2_value VALUE={printer["gcode_macro PRINTER_PARAM"].fan2_min + value}
          {% if value > (255 - printer['gcode_macro PRINTER_PARAM'].fan2_min) / 2 %}
            {% set value = printer["gcode_macro PRINTER_PARAM"].fan2_min + (255 - printer['gcode_macro PRINTER_PARAM'].fan2_min) / 2 %}
          {% else %}
            {% set value = printer["gcode_macro PRINTER_PARAM"].fan2_min + value %}
          {% endif %}
        {% else %}
          {% set value = printer["gcode_macro PRINTER_PARAM"].fan2_min + value %}
        {% endif %}
      {% endif %}
    {% endif %}
    {% if value >= 255 %}
      {% set value = 255 %}
    {% endif %}
    SET_PIN PIN=fan{fan} VALUE={value}
  {% endif %}

[filament_switch_sensor filament_sensor_2]
pause_on_runout: true
switch_pin: !nozzle_mcu:PA10
runout_gcode:
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G0 E30 F600
    G90
  {% endif %}
  PAUSE

[adxl345]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: x,-z,y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 75
probe_points: 110,110,10

[prtouch_v2]
pr_version: 1
step_base: 2
noz_ex_com: 0.06
tilt_corr_dis: 0
tri_min_hold: 2500,20000
tri_max_hold: 6000,60000
pres_cnt: 4
pres0_clk_pins: leveling_mcu:PA5
pres0_sdo_pins: leveling_mcu:PA1
pres1_clk_pins: leveling_mcu:PA2
pres1_sdo_pins: leveling_mcu:PA0
pres2_clk_pins: leveling_mcu:PA6
pres2_sdo_pins: leveling_mcu:PA3
pres3_clk_pins: leveling_mcu:PA7
pres3_sdo_pins: leveling_mcu:PA4
show_msg: False
step_swap_pin: PC10
pres_swap_pin: leveling_mcu:PB1
g28_wait_cool_down: true
pa_clr_down_mm: -0.15
clr_noz_start_x: 87
clr_noz_start_y: 225
clr_noz_len_x: 46
clr_noz_len_y: 1
speeds: 2.5,1.0
tri_hftr_cut: 2,1
tri_lftr_k1: 0.70,0.30
tri_try_max_times: 10
clr_noz_quick: false
clr_quick_high: 0.7
clr_xy_quick_spd: 100
clr_quick_times: 10
clr_quick_react_dis: 5

[bed_mesh]
speed: 150
mesh_min: 5,5
mesh_max: 215,215
probe_count: 5,5
fade_start: 5.0
fade_end: 50.0

[skew_correction]

[bl24c16f]
i2c_mcu: rpi
i2c_bus: i2c.2
i2c_speed: 400000

[virtual_sdcard]
path: /usr/data/printer_data/gcodes

[display_status]

[pause_resume]

[exclude_object]

[gcode_macro xyz_ready]
variable_x_ready: 0
variable_y_ready: 0
variable_z_ready: 0
variable_xy_moved: 0
variable_z_moved: 0
variable_safe_z: 3
gcode:

[gcode_macro _IF_HOME_Z]
gcode:
  {% if printer['gcode_macro xyz_ready'].z_ready|int == 1 %}
    {% if printer.toolhead.position.z|int < 5 %}
      {% set z_park = 5.0 - printer.toolhead.position.z|int %}
      G91
      G1 z{z_park} F600
      G90
    {% endif %}
  {% else %}
    {% if printer['gcode_macro xyz_ready'].z_moved|int == 0 %}
      {% if printer.print_stats.z_pos|float <= 20.0 or printer.print_stats.power_loss == 1 %}
        FORCE_MOVE STEPPER=stepper_z DISTANCE={printer["gcode_macro PRINTER_PARAM"].z_safe_g28} VELOCITY=10
      {% else %}
        FORCE_MOVE STEPPER=stepper_z DISTANCE=0.1 VELOCITY=10
      {% endif %}
      M400
      SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=z_moved VALUE=1
    {% endif %}
  {% endif %}

[gcode_macro _IF_MOVE_XY]
gcode:
  _IF_HOME_Z
  {% if printer['gcode_macro xyz_ready'].xy_moved|int == 0 %}
    {action_respond_info("move xy")}
    FORCE_MOVE STEPPER=stepper_y DISTANCE=-14 VELOCITY=50
    FORCE_MOVE STEPPER=stepper_y DISTANCE=7 VELOCITY=50
    M400
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=xy_moved VALUE=1
    G4 P1000
  {% endif %}

[gcode_macro _HOME_X]
gcode:
  _IF_MOVE_XY
  {% if printer['gcode_macro xyz_ready'].x_ready|int == 1 %}
    {% if (printer.configfile.settings['stepper_x'].position_max - printer.toolhead.position.x)|round < 10 %}
      {% set x_park = (10 - (printer.configfile.settings['stepper_x'].position_max - printer.toolhead.position.x))|round %}
      {% if x_park > 0 %}
        G91
        G1 x-{x_park} F3600
        G90
        G4 P1000
      {% endif %}
    {% endif %}
  {% endif %}
  M400
  G28 X
  SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=x_ready VALUE=1
  G91
  G1 x-10 F3600
  G90
  G4 P2000

[gcode_macro _HOME_Y]
gcode:
  _IF_MOVE_XY
  {% if printer['gcode_macro xyz_ready'].y_ready|int == 1 %}
    {% if printer.toolhead.position.y|round < 9 %}
      {% set y_park = 9 - printer.toolhead.position.y|round %}
      {% if y_park > 0 %}
        G91
        G1 y{y_park} F3600
        G90
        G4 P1000
      {% endif %}
    {% endif %}
  {% endif %}
  M400
  G28 Y
  SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=y_ready VALUE=1
  G91
  G1 y10 F3600
  G90
  G4 P2000

[gcode_macro _HOME_Z]
gcode:
  {% if printer['gcode_macro xyz_ready'].y_ready|int == 1 %}
    {% if printer['gcode_macro xyz_ready'].x_ready|int == 1 %}
      _IF_HOME_Z
    {% endif %}
  {% endif %}
  {% if printer.print_stats.z_pos|float >= 210.0 %}
    FORCE_MOVE STEPPER=stepper_z DISTANCE=-8 VELOCITY=10
    M400
  {% endif %}
  {% set POSITION_X = printer.configfile.settings['stepper_x'].position_max/2 %}
  {% set POSITION_Y = printer.configfile.settings['stepper_y'].position_max/2 %}
  G91
  {% set x_park = POSITION_X - printer.toolhead.position.x|int %}
  {% set y_park = POSITION_Y - printer.toolhead.position.y|int %}
  {action_respond_info("x_park = %s" % (x_park))}
  {action_respond_info("y_park = %s" % (y_park))}
  G1 x{x_park} y{y_park} F3600
  G90
  M400
  G28 Z
  SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=z_ready VALUE=1

[homing_override]
axes: xyz
gcode:
  M220 S100
  {% set x_axes = printer.toolhead.homed_axes %}
  {% if x_axes is defined and x_axes[0] is defined %}
    {action_respond_info("x_axes: %s" % (x_axes))}
  {% else %}
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=x_ready VALUE=0
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=y_ready VALUE=0
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=z_ready VALUE=0
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=xy_moved VALUE=0
    SET_GCODE_VARIABLE MACRO=xyz_ready VARIABLE=z_moved VALUE=0
    {action_respond_info("x_axes is NULL")}
  {% endif %}
  {% if x_axes is not defined or x_axes[2] is not defined %}
    BED_MESH_CLEAR
  {% endif %}
  {% if x_axes is defined and x_axes[0] is defined and x_axes[1] is defined %}
    {% set position_y = printer.toolhead.position.y|int %}
    {% set max_y_position = printer["gcode_macro PRINTER_PARAM"].max_y_position|int %}
    {% if position_y >= max_y_position %}
      G91
      G0 Y-10 F3600
      G90
    {% endif %}
  {% endif %}
  {% set home_all = 'X' not in params and 'Y' not in params %}
  {% if 'Z' in params and 'X' not in params and 'Y' not in params %}
    {% if x_axes[0] is defined and x_axes[1] is defined %}
      {% set home_all = 0 %}
    {% endif %}
  {% endif %}
  {% if home_all or 'X' in params %}_HOME_X{% endif %}
  {% if home_all or 'Y' in params %}_HOME_Y{% endif %}
  {% if home_all or 'X' in params %}_HOME_X{% endif %}
  {% if home_all or 'Y' in params %}_HOME_Y{% endif %}
  {% if home_all or 'Z' in params %}_HOME_Z{% endif %}
  {% if 'default' in printer.bed_mesh.profiles %}
    BED_MESH_PROFILE LOAD="default"
  {% elif 'k1c_mesh' in printer.bed_mesh.profiles %}
    BED_MESH_PROFILE LOAD="k1c_mesh"
  {% endif %}
  G4 P500

