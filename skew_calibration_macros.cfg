# =============================================================================
# skew_calibration_macros.cfg — Skew Calibration + UI Buttons
#
# REV 2026-10-11 (v2)
#   * Added APPLY_SKEW_PROFILE — one-click button to load the saved profile.
#   * Added CLEAR_SKEW_PROFILE — one-click button to clear active correction.
#   * Retained CALIBRATE_SKEW, SKEW_CLEAR, SKEW_STATUS.
#
# BUTTON VISIBILITY
#   In Mainsail:  Macros panel -> shows any macro with a `description:`.
#                 The description text is the button label.
#   In Fluidd:    Macros panel -> same behaviour.
#
# DEPENDENCY
#   Requires [skew_correction] in printer.cfg (already present).
#
# WORKFLOW
#   1. Print a calibration object with no correction active.
#   2. Measure AC, BD, AD (and optionally XZ/YZ) with calipers.
#   3. Run:  CALIBRATE_SKEW XY=AC,BD,AD
#   4. Run:  SAVE_CONFIG   (manual — Klipper requires this for safety)
#   5. Click the "Apply Skew Profile" button (or START_PRINT loads it
#      automatically).
#
# START_PRINT in gcode_macro.cfg loads SKEW_PROFILE LOAD=default on
# every print. END_PRINT clears it afterwards.
# =============================================================================

# -----------------------------------------------------------------------------
# BUTTON: Apply Skew Profile
# Click in Mainsail/Fluidd to load the saved "default" profile.
# -----------------------------------------------------------------------------
[gcode_macro APPLY_SKEW_PROFILE]
description: 🔧 Apply Skew Profile
gcode:
  {% if 'default' not in printer.configfile.settings %}
    {action_raise_error("No skew profile 'default' exists. Run CALIBRATE_SKEW first, then SAVE_CONFIG.")}
  {% endif %}
  SKEW_PROFILE LOAD=default
  {action_respond_info("APPLY_SKEW_PROFILE: Profile 'default' loaded.")}

# -----------------------------------------------------------------------------
# BUTTON: Clear Skew Profile
# Click to remove any active skew correction (returns to raw frame).
# -----------------------------------------------------------------------------
[gcode_macro CLEAR_SKEW_PROFILE]
description: 🧹 Clear Skew Profile
gcode:
  SET_SKEW CLEAR=1
  {action_respond_info("CLEAR_SKEW_PROFILE: Skew correction cleared.")}

# -----------------------------------------------------------------------------
# BUTTON: Show Skew Status
# Prints the currently active skew factors to the console.
# -----------------------------------------------------------------------------
[gcode_macro SKEW_STATUS]
description: 📊 Show Skew Status
gcode:
  SET_SKEW
  {action_respond_info("SKEW_STATUS: Active skew factors shown above.")}

# -----------------------------------------------------------------------------
# CALIBRATION: Apply measurements and save profile
#
# Not a button — takes parameters. Run from the console:
#   CALIBRATE_SKEW XY=140.4,142.8,99.8
#   CALIBRATE_SKEW XY=140.4,142.8,99.8 XZ=... YZ=...
# -----------------------------------------------------------------------------
[gcode_macro CALIBRATE_SKEW]
description: Calibrate skew from measurements (console only)
gcode:
  {% set cmd = "SET_SKEW" %}
  {% if 'XY' in params %}
    {% set cmd = cmd + " XY=" + params.XY %}
  {% endif %}
  {% if 'XZ' in params %}
    {% set cmd = cmd + " XZ=" + params.XZ %}
  {% endif %}
  {% if 'YZ' in params %}
    {% set cmd = cmd + " YZ=" + params.YZ %}
  {% endif %}

  {% if cmd == "SET_SKEW" %}
    {action_raise_error("CALIBRATE_SKEW: No plane specified. Use XY=AC,BD,AD (and optionally XZ=, YZ=).")}
  {% endif %}

  {action_respond_info("CALIBRATE_SKEW: Applying %s" % cmd)}
  {cmd}

  SKEW_PROFILE SAVE=default
  {action_respond_info("CALIBRATE_SKEW: Profile 'default' saved to RAM. Run SAVE_CONFIG to persist.")}

# -----------------------------------------------------------------------------
# SKEW_CLEAR — legacy name (kept for backward compatibility with any
# existing console history or scripts that call it).
# -----------------------------------------------------------------------------
[gcode_macro SKEW_CLEAR]
description: Clear active skew correction (legacy alias)
gcode:
  SET_SKEW CLEAR=1
  {action_respond_info("SKEW_CLEAR: Skew correction cleared.")}