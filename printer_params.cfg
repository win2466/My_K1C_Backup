# K1C
# Printer_size: 220x220x250
# Version: v1.3.0
# CreateDate: 2023/09/05
# REV 2026-10-09:
#   * Qmode stub expanded to include every variable the Creality Klipper
#     fork reads from [gcode_macro Qmode]. Specifically the patched
#     toolhead.py cmd_SET_VELOCITY_LIMIT calls:
#         Qmode.getfloat('variable_max_accel')
#     and will halt the printer with a configparser error if that
#     option is not declared. The additional velocity variables are
#     declared defensively for the same reason — Creality's fork may
#     consult them in other code paths.
#   * PRINTER_PARAM retains variable_fans: 3, required by stock M106.

[fan_feedback]
fan0_pin: nozzle_mcu:PB4
fan1_pin: PC6
print_delay_time: 5
current_delay_time: 2

[custom_macro]
default_bed_temp: 50
default_extruder_temp: 240
g28_ext_temp: 140

# 产品定义参数
[gcode_macro product_param]
# 模型成型尺寸
variable_bed_size_x: 220
variable_bed_size_y: 220
variable_bed_size_z: 220
# 支持最高温度
variable_nozzle_temp: 300
variable_bed_temp: 100
variable_chamber_temp: 60
gcode:

# =============================================================================
# PRINTER_PARAM — shared runtime state for homing, M600 and RESUME.
# =============================================================================
[gcode_macro PRINTER_PARAM]
variable_max_z_position: 255
variable_max_y_position: 227
variable_z_safe_g28: 10.0
variable_fans: 3
variable_z_safe_pause: 0
variable_hotend_temp: 0
variable_fan0_speed: 0
variable_fan1_speed: 0
variable_fan2_speed: 0
variable_fan0_min: 0
variable_fan1_min: 0
variable_fan2_min: 0
gcode:

# =============================================================================
# Qmode — quiet mode state, read by Creality's patched Klipper.
#
# The K1C Klipper fork modifies toolhead.py so that every
# SET_VELOCITY_LIMIT call reads the Qmode velocity limits. If any of the
# variables below are missing, Klipper raises:
#     "Option 'variable_max_accel' in section 'gcode_macro Qmode'
#      must be specified"
# and halts the printer mid-print.
#
# flag = 0 means quiet mode is disabled, so these limits are inert.
# They only need to be declared and syntactically valid.
# =============================================================================
[gcode_macro Qmode]
variable_flag: 0
variable_max_accel: 15000
variable_max_velocity: 600
variable_max_z_velocity: 10
variable_max_accel_to_decel: 7500
variable_fan0_value: 0
variable_fan1_value: 0
variable_fan2_value: 0
gcode:
