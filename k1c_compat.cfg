# =============================================================================
# k1c_compat.cfg
#
# Shims for commands your custom macros call that the live Klipper config
# does NOT provide. M106 and M141 are provided by the stock Creality macros
# and are intentionally omitted — redefining them would halt Klipper.
# =============================================================================

[gcode_macro RESTORE_E_CURRENT]
description: Restore extruder TMC run current to configured value
gcode:
  {% set rc = printer.configfile.settings['tmc2209 extruder'].run_current|float %}
  SET_TMC_CURRENT STEPPER=extruder CURRENT={rc}

[gcode_macro SET_E_MIN_CURRENT]
description: Reduce extruder TMC current for long filament-change idle
gcode:
  SET_TMC_CURRENT STEPPER=extruder CURRENT=0.25

[gcode_macro M107]
description: Turn off fan (K1C: P0=fan0, P1=fan1, P2=fan2)
gcode:
  {% set fan = params.P|default(0)|int %}
  {% if fan == 0 %}
    SET_PIN PIN=fan0 VALUE=0
  {% elif fan == 1 %}
    SET_PIN PIN=fan1 VALUE=0
  {% elif fan == 2 %}
    SET_PIN PIN=fan2 VALUE=0
  {% else %}
    {action_raise_error("M107: invalid fan index P" ~ fan ~ " (valid: 0, 1, 2)")}
  {% endif %}

[gcode_macro WAIT_TEMP_END]
description: Wait for bed and extruder to reach their current targets
gcode:
  {% if printer.heater_bed.target|float > 0 %}
    M190 S{printer.heater_bed.target}
  {% endif %}
  {% if printer.extruder.target|float > 0 %}
    M109 S{printer.extruder.target}
  {% endif %}

[gcode_macro WAIT_TEMP_START]
description: Compatibility no-op (Creality PID_HOTEND tail call)
gcode:
  RESPOND TYPE=command MSG="WAIT_TEMP_START: no-op"

[gcode_macro PRINT_PREPARE_CLEAR]
description: Clear the START_PRINT prepare flag
gcode:
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=prepare VALUE=0

[gcode_macro ACCURATE_G28]
description: Compatibility wrapper around G28
gcode:
  G28
