# =============================================================================
# k1c_compat.cfg
#
# Shims for commands your custom macros call that the live Klipper config
# does NOT provide. M106 and M141 are provided by the stock Creality macros
# and are intentionally omitted — redefining them would halt Klipper.
#
# REV 2026-10-14
#   * Absorbed all git-backup macros from Helper-Script/git-backup.cfg.
#     Reason: that file lives in a read-only folder, and its original
#     content had nested double-quote bugs in three prompt_footer_button
#     lines. Rather than fight the read-only flag, the include is removed
#     from printer.cfg and the fixed versions live here.
#   * Fixed: GIT_BACKUP_STOP, GIT_BACKUP_PAUSE, GIT_BACKUP_RESUME now use
#     single-quote outer strings for prompt_footer_button NO|...
# =============================================================================

# -----------------------------------------------------------------------------
# Extruder TMC current helpers (used by M600 support)
# -----------------------------------------------------------------------------
[gcode_macro RESTORE_E_CURRENT]
description: Restore extruder TMC run current to configured value
gcode:
  {% set rc = printer.configfile.settings['tmc2209 extruder'].run_current|float %}
  SET_TMC_CURRENT STEPPER=extruder CURRENT={rc}

[gcode_macro SET_E_MIN_CURRENT]
description: Reduce extruder TMC current for long filament-change idle
gcode:
  SET_TMC_CURRENT STEPPER=extruder CURRENT=0.25

# -----------------------------------------------------------------------------
# Fan compatibility
# -----------------------------------------------------------------------------
[gcode_macro M107]
description: Turn off fan (K1C: P0=fan0, P1=fan1, P2=fan2)
gcode:
  {% set fan = params.P|default(0)|int %}
  {% if fan == 0 %}
    SET_PIN PIN=fan0 VALUE=0
  {% elif fan == 1 %}
    SET_PIN PIN=fan1 VALUE=0
  {% elif fan == 2 %}
    SET_PIN PIN=fan2 VALUE=0
  {% else %}
    {action_raise_error("M107: invalid fan index P" ~ fan ~ " (valid: 0, 1, 2)")}
  {% endif %}

# -----------------------------------------------------------------------------
# Temperature wait / homing shims
# -----------------------------------------------------------------------------
[gcode_macro WAIT_TEMP_END]
description: Wait for bed and extruder to reach their current targets
gcode:
  {% if printer.heater_bed.target|float > 0 %}
    M190 S{printer.heater_bed.target}
  {% endif %}
  {% if printer.extruder.target|float > 0 %}
    M109 S{printer.extruder.target}
  {% endif %}

[gcode_macro WAIT_TEMP_START]
description: Compatibility no-op (Creality PID_HOTEND tail call)
gcode:
  RESPOND TYPE=command MSG="WAIT_TEMP_START: no-op"

[gcode_macro PRINT_PREPARE_CLEAR]
description: Clear the START_PRINT prepare flag
gcode:
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=prepare VALUE=0

[gcode_macro ACCURATE_G28]
description: Compatibility wrapper around G28
gcode:
  G28

# =============================================================================
# Git Backup — absorbed from Helper-Script/git-backup.cfg
#
# Original file is read-only; the include for it has been removed from
# printer.cfg. These definitions supersede it. Do NOT re-add the include.
# =============================================================================

[gcode_shell_command Backup_Stop]
command: sh /usr/data/helper-script/files/git-backup/git-backup.sh -s
timeout: 600.0
verbose: true

[gcode_shell_command Backup_Pause]
command: sh /usr/data/helper-script/files/git-backup/git-backup.sh -p
timeout: 600.0
verbose: true

[gcode_shell_command Backup_Resume]
command: sh /usr/data/helper-script/files/git-backup/git-backup.sh -r
timeout: 600.0
verbose: true

[gcode_macro _GIT_STOP]
description: Stop pushing to GitHub until manually resumed
gcode:
  RUN_SHELL_COMMAND CMD=Backup_Stop
  RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro _GIT_PAUSE]
description: Stop pushing to GitHub until next reboot or until manually resumed
gcode:
  RUN_SHELL_COMMAND CMD=Backup_Pause
  RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro _GIT_RESUME]
description: Resume pushing to GitHub
gcode:
  RUN_SHELL_COMMAND CMD=Backup_Resume
  RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro GIT_BACKUP_STOP]
description: Stop pushing to GitHub until manually resumed
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Git Backup"
  RESPOND TYPE=command MSG="action:prompt_text Do you want to stop pushing to GitHub until manually resumed?"
  RESPOND TYPE=command MSG='action:prompt_footer_button NO|RESPOND TYPE=command MSG="action:prompt_end"|error'
  RESPOND TYPE=command MSG="action:prompt_footer_button YES|_GIT_STOP|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro GIT_BACKUP_PAUSE]
description: Stop pushing to GitHub until next reboot or until manually resumed
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Git Backup"
  RESPOND TYPE=command MSG="action:prompt_text Do you want to stop pushing to GitHub until next reboot or until manually resumed?"
  RESPOND TYPE=command MSG='action:prompt_footer_button NO|RESPOND TYPE=command MSG="action:prompt_end"|error'
  RESPOND TYPE=command MSG="action:prompt_footer_button YES|_GIT_PAUSE|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro GIT_BACKUP_RESUME]
description: Resume pushing to GitHub
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Git Backup"
  RESPOND TYPE=command MSG="action:prompt_text Do you want to resume pushing to GitHub?"
  RESPOND TYPE=command MSG='action:prompt_footer_button NO|RESPOND TYPE=command MSG="action:prompt_end"|error'
  RESPOND TYPE=command MSG="action:prompt_footer_button YES|_GIT_RESUME|primary"
  RESPOND TYPE=command MSG="action:prompt_show"