########################################
# Guppy Screen Update
#
# Caveats:
#   * GUPPY_UPDATE calls /usr/data/helper-script/files/guppy-screen/
#     guppy-update.sh. That script ships with Helper-Script, so it is
#     present when Helper-Script is installed.
#   * INPUT_SHAPER_CALIBRATION calls CXSAVE_CONFIG at the end. If your
#     Creality fork does not expose CXSAVE_CONFIG, that button will
#     warn but not crash. Comment out the last line if you prefer.
#   * soc_fan guards use .get() so a missing [temperature_fan soc_fan]
#     section (Helper-Script fans-control.cfg is not included) does
#     not raise a template error.
########################################

[gcode_shell_command guppy_update]
command: sh /usr/data/helper-script/files/guppy-screen/guppy-update.sh
timeout: 600.0
verbose: True

[gcode_macro GUPPY_UPDATE]
description: Check for Guppy Screen Updates
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
    RESPOND TYPE=error MSG="Cannot update Guppy Screen while printing"
  {% else %}
    RUN_SHELL_COMMAND CMD=guppy_update
  {% endif %}

[gcode_macro INPUT_SHAPER_CALIBRATION]
description: Measure X and Y Axis Resonances and Save values
gcode:
  {% if printer["configfile"].config.get("temperature_fan soc_fan") is not none %}
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=soc_fan TARGET=30
  {% endif %}
  {% if printer.toolhead.homed_axes != "xyz" %}
    G28
  {% endif %}
  SHAPER_CALIBRATE
  M400
  {% if printer["configfile"].config.get("temperature_fan soc_fan") is not none %}
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=soc_fan TARGET=45
  {% endif %}
  {% if "CXSAVE_CONFIG" in printer %}
    CXSAVE_CONFIG
  {% else %}
    SAVE_CONFIG
  {% endif %}
