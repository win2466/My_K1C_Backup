[save_variables]
filename: /usr/data/printer_data/config/Helper-Script/variables.cfg

[gcode_macro _ZOFFSET_FLAGS]
variable_suppress_save: 0
gcode:

[gcode_macro SET_GCODE_OFFSET]
description: Save Z-offset with live+saved clamp (max +/- 0.5mm)
rename_existing: _SET_GCODE_OFFSET
gcode:
  {% if printer.save_variables.variables.zoffset is defined
        and printer.save_variables.variables.zoffset.z is not none %}
    {% set current = printer.save_variables.variables.zoffset.z | float %}
  {% else %}
    {% set current = 0.0 %}
  {% endif %}

  {% if 'Z' in params %}
    {% set raw = params.Z | float %}
    {% set applied = raw %}
    {% if raw < -0.5 %}
      {% set applied = -0.5 %}
      {action_respond_info("Z clamped: requested %s -> applied %s (limit -0.5)" % (raw, applied))}
    {% elif raw > 0.5 %}
      {% set applied = 0.5 %}
      {action_respond_info("Z clamped: requested %s -> applied %s (limit +0.5)" % (raw, applied))}
    {% endif %}
    _SET_GCODE_OFFSET Z={applied}{% if 'MOVE' in params %} MOVE={params.MOVE}{% endif %}
    {% if printer['gcode_macro _ZOFFSET_FLAGS'].suppress_save|int == 0 %}
      {% set ns = namespace(zoffset={'z': applied | round(4)}) %}
      SAVE_VARIABLE VARIABLE=zoffset VALUE="{ns.zoffset}"
    {% endif %}

  {% elif 'Z_ADJUST' in params %}
    {% set delta = params.Z_ADJUST | float %}
    {% set target = current + delta %}
    {% set applied_delta = delta %}
    {% set new_total = target %}
    {% if target < -0.5 %}
      {% set applied_delta = -0.5 - current %}
      {% set new_total = -0.5 %}
      {action_respond_info("Z_ADJUST clamped: %s from %s -> %s (would be %s)" % (delta, current, applied_delta, target))}
    {% elif target > 0.5 %}
      {% set applied_delta = 0.5 - current %}
      {% set new_total = 0.5 %}
      {action_respond_info("Z_ADJUST clamped: %s from %s -> %s (would be %s)" % (delta, current, applied_delta, target))}
    {% endif %}
    _SET_GCODE_OFFSET Z_ADJUST={applied_delta}{% if 'MOVE' in params %} MOVE={params.MOVE}{% endif %}
    {% if printer['gcode_macro _ZOFFSET_FLAGS'].suppress_save|int == 0 %}
      {% set ns = namespace(zoffset={'z': new_total | round(4)}) %}
      SAVE_VARIABLE VARIABLE=zoffset VALUE="{ns.zoffset}"
    {% endif %}

  {% else %}
    _SET_GCODE_OFFSET {% for p in params %}{'%s=%s '% (p, params[p])}{% endfor %}
  {% endif %}

[gcode_macro ZOFFSET_CLEAR]
description: Suspend Z-offset (saves blocked) - for pre-mesh state
gcode:
  SET_GCODE_VARIABLE MACRO=_ZOFFSET_FLAGS VARIABLE=suppress_save VALUE=1
  _SET_GCODE_OFFSET Z=0 MOVE=0
  RESPOND TYPE=command MSG="Z-offset suspended (saves blocked)"

[gcode_macro ZOFFSET_RESTORE]
description: Re-apply saved Z-offset and re-enable saves
gcode:
  {% if printer.save_variables.variables.zoffset is defined
        and printer.save_variables.variables.zoffset.z is not none %}
    {% set saved = printer.save_variables.variables.zoffset.z %}
    _SET_GCODE_OFFSET Z={saved} MOVE=0
    RESPOND TYPE=command MSG="Z-offset restored: {saved}mm"
  {% else %}
    _SET_GCODE_OFFSET Z=0 MOVE=0
    RESPOND TYPE=command MSG="Z-offset: no saved value, using 0"
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_ZOFFSET_FLAGS VARIABLE=suppress_save VALUE=0

[gcode_macro ZOFFSET_APPLY]
description: Re-apply saved Z-offset now
gcode:
  ZOFFSET_RESTORE

[gcode_macro ZOFFSET_STATUS]
description: Report live + saved + suppress
gcode:
  {% if printer.save_variables.variables.zoffset is defined
        and printer.save_variables.variables.zoffset.z is not none %}
    {% set saved = printer.save_variables.variables.zoffset.z %}
  {% else %}
    {% set saved = "missing" %}
  {% endif %}
  {% set live = printer.gcode_move.homing_origin.z %}
  {% set suppress = printer['gcode_macro _ZOFFSET_FLAGS'].suppress_save %}
  {action_respond_info("Z-offset: live=%s  saved=%s  suppress=%s" % (live, saved, suppress))}

[gcode_macro ZOFFSET_RESET]
description: Clear live and saved Z-offset (for probe re-calibration)
gcode:
  SET_GCODE_VARIABLE MACRO=_ZOFFSET_FLAGS VARIABLE=suppress_save VALUE=1
  _SET_GCODE_OFFSET Z=0 MOVE=0
  {% set ns = namespace(zoffset={'z': 0.0}) %}
  SAVE_VARIABLE VARIABLE=zoffset VALUE="{ns.zoffset}"
  SET_GCODE_VARIABLE MACRO=_ZOFFSET_FLAGS VARIABLE=suppress_save VALUE=0
  RESPOND TYPE=command MSG="Z-offset fully reset: live=0, saved=0"

