# =============================================================================
# zoffset-guppy.cfg
# K1C Z-offset persistence with clamp, validation, and recovery.
#
# REV 2026-10-26 (v14.0)
#   * SET_GCODE_OFFSET Z= and Z_ADJUST= reject non-numeric input instead
#     of silently falling back to 0.0 (which would zero+save the offset).
#   * Rejects simultaneous Z and Z_ADJUST with a clear error.
#   * Z_ADJUST clamps against LIVE (homing_origin.z), not saved.
#     Behavior-identical today because thermal_comp was removed from
#     START_PRINT (live==saved), but correct if any future delta layer
#     is introduced.
#   * LOAD_GCODE_OFFSETS: 5s initial delay (was 10s). Does not retry
#     while Printing/Paused (previously retried every 10s forever,
#     spamming the log during long pauses).
#   * All { ... } expressions on one line.
#   * ZOFFSET_CLEAR skips _SET_GCODE_OFFSET when live is already 0
#     (avoids an unnecessary SET_GCODE_OFFSET on fresh boots).
#
# ITEM 2 OF LIFECYCLE:
#   thermal_comp was removed from START_PRINT (see printer.cfg v13.6).
#   Saved value now equals live value after ZOFFSET_RESTORE. Guppy Screen
#   and the physical nozzle agree exactly. Re-tune once at normal print
#   temperature.
# =============================================================================

[save_variables]
filename: /usr/data/printer_data/config/Helper-Script/variables.cfg

[gcode_macro _ZOFFSET_FLAGS]
variable_suppress_save: 0
gcode:

[gcode_macro SET_GCODE_OFFSET]
description: Save Z-offset with live+saved clamp (max +/-0.5mm)
rename_existing: _SET_GCODE_OFFSET
gcode:
  {% if 'Z' in params and 'Z_ADJUST' in params %}
    {action_raise_error("SET_GCODE_OFFSET: pass only one of Z= or Z_ADJUST=")}
  {% endif %}
  {% set move_extra = "" %}
  {% if 'MOVE' in params %}
    {% set move_extra = move_extra + " MOVE=" + params.MOVE %}
  {% endif %}
  {% if 'MOVE_SPEED' in params %}
    {% set move_extra = move_extra + " MOVE_SPEED=" + params.MOVE_SPEED %}
  {% endif %}
  {% if 'Z' in params %}
    {% set raw = params.Z | float(default=none) %}
    {% if raw is none %}
      {action_raise_error("SET_GCODE_OFFSET: invalid Z value '%s'" % params.Z)}
    {% endif %}
    {% set applied = raw %}
    {% if raw < -0.5 %}
      {% set applied = -0.5 %}
      {action_respond_info("Z clamped: requested %s -> applied %s (limit -0.5)" % (raw, applied))}
    {% elif raw > 0.5 %}
      {% set applied = 0.5 %}
      {action_respond_info("Z clamped: requested %s -> applied %s (limit +0.5)" % (raw, applied))}
    {% endif %}
    _SET_GCODE_OFFSET Z={applied}{move_extra}
    {% if printer['gcode_macro _ZOFFSET_FLAGS'].suppress_save|int == 0 %}
      {% set ns = namespace(zoffset={'z': applied | round(4)}) %}
      SAVE_VARIABLE VARIABLE=zoffset VALUE="{ns.zoffset}"
    {% endif %}
  {% elif 'Z_ADJUST' in params %}
    {% set delta = params.Z_ADJUST | float(default=none) %}
    {% if delta is none %}
      {action_raise_error("SET_GCODE_OFFSET: invalid Z_ADJUST value '%s'" % params.Z_ADJUST)}
    {% endif %}
    {% set live = printer.gcode_move.homing_origin.z | float %}
    {% set target = live + delta %}
    {% set applied_delta = delta %}
    {% set new_total = target %}
    {% if target < -0.5 %}
      {% set applied_delta = -0.5 - live %}
      {% set new_total = -0.5 %}
      {action_respond_info("Z_ADJUST clamped: %s from live %s -> %s (would be %s)" % (delta, live, applied_delta, target))}
    {% elif target > 0.5 %}
      {% set applied_delta = 0.5 - live %}
      {% set new_total = 0.5 %}
      {action_respond_info("Z_ADJUST clamped: %s from live %s -> %s (would be %s)" % (delta, live, applied_delta, target))}
    {% endif %}
    _SET_GCODE_OFFSET Z_ADJUST={applied_delta}{move_extra}
    {% if printer['gcode_macro _ZOFFSET_FLAGS'].suppress_save|int == 0 %}
      {% set ns = namespace(zoffset={'z': new_total | round(4)}) %}
      SAVE_VARIABLE VARIABLE=zoffset VALUE="{ns.zoffset}"
    {% endif %}
  {% else %}
    _SET_GCODE_OFFSET {% for p in params %}{'%s=%s '% (p, params[p])}{% endfor %}
  {% endif %}

[gcode_macro ZOFFSET_UNSUPPRESS]
description: Re-enable saving of Z-offset changes
gcode:
  {% if printer['gcode_macro _ZOFFSET_FLAGS'].suppress_save|int != 0 %}
    SET_GCODE_VARIABLE MACRO=_ZOFFSET_FLAGS VARIABLE=suppress_save VALUE=0
    RESPOND TYPE=command MSG="Z-offset: saving re-enabled"
  {% endif %}

[gcode_macro ZOFFSET_CLEAR]
description: Suspend Z-offset (saves blocked) - for pre-mesh state
gcode:
  SET_GCODE_VARIABLE MACRO=_ZOFFSET_FLAGS VARIABLE=suppress_save VALUE=1
  {% if printer.gcode_move.homing_origin.z|float != 0 %}
    _SET_GCODE_OFFSET Z=0 MOVE=0
  {% endif %}
  RESPOND TYPE=command MSG="Z-offset suspended (saves blocked)"

[gcode_macro ZOFFSET_RESTORE]
description: Re-apply saved Z-offset and re-enable saves
gcode:
  {% if printer.save_variables.variables.zoffset is defined and printer.save_variables.variables.zoffset.z is not none %}
    {% set saved = printer.save_variables.variables.zoffset.z %}
    _SET_GCODE_OFFSET Z={saved} MOVE=0
    RESPOND TYPE=command MSG="Z-offset restored"
  {% else %}
    _SET_GCODE_OFFSET Z=0 MOVE=0
    RESPOND TYPE=command MSG="Z-offset: no saved value, using 0"
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_ZOFFSET_FLAGS VARIABLE=suppress_save VALUE=0

[gcode_macro ZOFFSET_APPLY]
description: Re-apply saved Z-offset now
gcode:
  ZOFFSET_RESTORE

[gcode_macro ZOFFSET_STATUS]
description: Report live + saved + suppress state
gcode:
  {% if printer.save_variables.variables.zoffset is defined and printer.save_variables.variables.zoffset.z is not none %}
    {% set saved = printer.save_variables.variables.zoffset.z %}
  {% else %}
    {% set saved = "missing" %}
  {% endif %}
  {% set live = printer.gcode_move.homing_origin.z %}
  {% set suppress = printer['gcode_macro _ZOFFSET_FLAGS'].suppress_save %}
  {% set probe = printer.configfile.settings['prtouch_v2'].z_offset|default(0)|float %}
  {action_respond_info("Z-offset: live=%s  saved=%s  suppress=%s  prtouch_probe=%s" % (live, saved, suppress, probe))}

[gcode_macro ZOFFSET_RESET]
description: Clear live and saved Z-offset (for probe re-calibration)
gcode:
  SET_GCODE_VARIABLE MACRO=_ZOFFSET_FLAGS VARIABLE=suppress_save VALUE=1
  _SET_GCODE_OFFSET Z=0 MOVE=0
  {% set ns = namespace(zoffset={'z': 0.0}) %}
  SAVE_VARIABLE VARIABLE=zoffset VALUE="{ns.zoffset}"
  SET_GCODE_VARIABLE MACRO=_ZOFFSET_FLAGS VARIABLE=suppress_save VALUE=0
  RESPOND TYPE=command MSG="Z-offset fully reset: live=0, saved=0"

[delayed_gcode LOAD_GCODE_OFFSETS]
initial_duration: 5
gcode:
  {% if printer.idle_timeout.state in ("Idle", "Ready") %}
    ZOFFSET_RESTORE
  {% elif printer.idle_timeout.state in ("Printing", "Paused") %}
    RESPOND TYPE=command MSG="LOAD_GCODE_OFFSETS: print active, offset already applied by START_PRINT"
  {% else %}
    RESPOND TYPE=command MSG="LOAD_GCODE_OFFSETS: printer busy (%s), retry in 5s" % printer.idle_timeout.state
    UPDATE_DELAYED_GCODE ID=LOAD_GCODE_OFFSETS DURATION=5
  {% endif %}