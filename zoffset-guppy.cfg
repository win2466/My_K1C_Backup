########################################
# Z-Offset with GuppyScreen on-screen tuning
#
# REV 2026-10-14:
#   * ZOFFSET_RESTORE uses `is not none` semantics instead of Jinja
#     truthiness. Combined with variables.cfg using `None`, this
#     removes the "0 is falsy" trap that could skip restore.
#   * Everything else retained from 2026-10-08.
########################################

[save_variables]
filename: /usr/data/printer_data/config/Helper-Script/variables.cfg

[gcode_macro _ZOFFSET_FLAGS]
variable_suppress_save: 0
gcode:

[gcode_macro SET_GCODE_OFFSET]
description: Saving Z-Offset (guarded against Creality macro resets)
rename_existing: _SET_GCODE_OFFSET
gcode:
  {% if printer.save_variables.variables.zoffset %}
    {% set zoffset = printer.save_variables.variables.zoffset %}
  {% else %}
    {% set zoffset = {'z': None} %}
  {% endif %}
  {% set ns = namespace(zoffset={'z': zoffset.z}) %}

  _SET_GCODE_OFFSET {% for p in params %}{'%s=%s '% (p, params[p])}{% endfor %}

  {% if printer['gcode_macro _ZOFFSET_FLAGS'].suppress_save|int == 0 %}
    {% if 'Z' in params %}
      {% set null = ns.zoffset.update({'z': params.Z}) %}
    {% endif %}
    {% if 'Z_ADJUST' in params %}
      {% if ns.zoffset.z is none %}
        {% set null = ns.zoffset.update({'z': 0}) %}
      {% endif %}
      {% set null = ns.zoffset.update({'z': (ns.zoffset.z | float) + (params.Z_ADJUST | float)}) %}
    {% endif %}
    SAVE_VARIABLE VARIABLE=zoffset VALUE="{ns.zoffset}"
  {% endif %}

[gcode_macro ZOFFSET_CLEAR]
description: Temporarily zero the gcode Z-offset and block saves until restore
gcode:
  SET_GCODE_VARIABLE MACRO=_ZOFFSET_FLAGS VARIABLE=suppress_save VALUE=1
  _SET_GCODE_OFFSET Z=0 MOVE=0
  RESPOND TYPE=command MSG="Z-offset suspended for mesh calibration (saves blocked)"

[gcode_macro ZOFFSET_RESTORE]
description: Re-apply the saved gcode Z-offset and re-enable saves
gcode:
  {% if printer.save_variables.variables.zoffset %}
    {% set zoffset = printer.save_variables.variables.zoffset %}
    {% if zoffset.z is not none %}
      _SET_GCODE_OFFSET Z={zoffset.z} MOVE=0
      RESPOND TYPE=command MSG="Z-offset restored: {zoffset.z}mm"
    {% else %}
      RESPOND TYPE=command MSG="No stored Z-offset to restore"
    {% endif %}
  {% else %}
    RESPOND TYPE=command MSG="variables.cfg missing zoffset entry"
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_ZOFFSET_FLAGS VARIABLE=suppress_save VALUE=0

[gcode_macro ZOFFSET_APPLY]
description: Apply the saved gcode Z-offset now
gcode:
  ZOFFSET_RESTORE

[delayed_gcode LOAD_GCODE_OFFSETS]
initial_duration: 2
gcode:
  ZOFFSET_RESTORE