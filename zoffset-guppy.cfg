[save_variables]
filename: /usr/data/printer_data/config/Helper-Script/variables.cfg

[gcode_macro _ZOFFSET_FLAGS]
variable_suppress_save: 0
gcode:

[gcode_macro SET_GCODE_OFFSET]
description: Saving Z-Offset with accumulation guard
rename_existing: _SET_GCODE_OFFSET
gcode:
  {% if printer.save_variables.variables.zoffset is defined %}
    {% set zoffset = printer.save_variables.variables.zoffset %}
  {% else %}
    {% set zoffset = {'z': None} %}
  {% endif %}
  {% set ns = namespace(zoffset={'z': zoffset.z}) %}

  _SET_GCODE_OFFSET {% for p in params %}{'%s=%s '% (p, params[p])}{% endfor %}

  {% if printer['gcode_macro _ZOFFSET_FLAGS'].suppress_save|int == 0 %}
    {% if 'Z' in params %}
      {% set null = ns.zoffset.update({'z': params.Z|float}) %}
    {% endif %}
    {% if 'Z_ADJUST' in params %}
      {% if ns.zoffset.z is none %}
        {% set null = ns.zoffset.update({'z': 0.0}) %}
      {% endif %}
      {% set new_z = (ns.zoffset.z | float) + (params.Z_ADJUST | float) %}
      {% if new_z < -0.5 %}
        {% set new_z = -0.5 %}
        {action_respond_info("Z_ADJUST clamped to -0.5mm - offset too large. Re-run probe calibration if error is real.")}
      {% elif new_z > 0.5 %}
        {% set new_z = 0.5 %}
        {action_respond_info("Z_ADJUST clamped to +0.5mm")}
      {% endif %}
      {% set null = ns.zoffset.update({'z': new_z}) %}
    {% endif %}
    SAVE_VARIABLE VARIABLE=zoffset VALUE="{ns.zoffset}"
  {% endif %}

[gcode_macro ZOFFSET_CLEAR]
description: Suspend Z offset (saves blocked)
gcode:
  SET_GCODE_VARIABLE MACRO=_ZOFFSET_FLAGS VARIABLE=suppress_save VALUE=1
  _SET_GCODE_OFFSET Z=0 MOVE=0
  RESPOND TYPE=command MSG="Z-offset suspended (saves blocked)"

[gcode_macro ZOFFSET_RESTORE]
description: Re-apply saved Z offset and re-enable saves
gcode:
  {% if printer.save_variables.variables.zoffset is defined %}
    {% set zoffset = printer.save_variables.variables.zoffset %}
    {% if zoffset.z is not none %}
      _SET_GCODE_OFFSET Z={zoffset.z} MOVE=0
      RESPOND TYPE=command MSG="Z-offset restored: {zoffset.z}mm"
    {% else %}
      _SET_GCODE_OFFSET Z=0 MOVE=0
      RESPOND TYPE=command MSG="Z-offset: no saved value, using 0"
    {% endif %}
  {% else %}
    RESPOND TYPE=command MSG="Z-offset: variables.cfg missing entry"
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_ZOFFSET_FLAGS VARIABLE=suppress_save VALUE=0

[gcode_macro ZOFFSET_APPLY]
description: Re-apply saved Z offset now
gcode:
  ZOFFSET_RESTORE

[gcode_macro ZOFFSET_STATUS]
description: Report current live and saved Z offset
gcode:
  {% if printer.save_variables.variables.zoffset is defined %}
    {% set saved = printer.save_variables.variables.zoffset.z %}
  {% else %}
    {% set saved = "missing" %}
  {% endif %}
  {% set live = printer.gcode_move.homing_origin.z %}
  {action_respond_info("Z-offset: live=%s  saved=%s  suppress=%s" % (live, saved, printer['gcode_macro _ZOFFSET_FLAGS'].suppress_save))}

[gcode_macro ZOFFSET_RESET]
description: Clear both live and saved Z offset (after probe re-calibration)
gcode:
  SET_GCODE_VARIABLE MACRO=_ZOFFSET_FLAGS VARIABLE=suppress_save VALUE=1
  _SET_GCODE_OFFSET Z=0 MOVE=0
  SAVE_VARIABLE VARIABLE=zoffset VALUE="{'z': 0.0}"
  SET_GCODE_VARIABLE MACRO=_ZOFFSET_FLAGS VARIABLE=suppress_save VALUE=0
  RESPOND TYPE=command MSG="Z-offset fully reset: live=0, saved=0"

[delayed_gcode LOAD_GCODE_OFFSETS]
initial_duration: 10
gcode:
  {% if printer.idle_timeout.state == "Idle" or printer.idle_timeout.state == "Ready" %}
    ZOFFSET_RESTORE
  {% else %}
    RESPOND TYPE=command MSG="LOAD_GCODE_OFFSETS: printer busy, retrying in 10s"
    UPDATE_DELAYED_GCODE ID=LOAD_GCODE_OFFSETS DURATION=10
  {% endif %}
