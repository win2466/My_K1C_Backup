cat > /usr/data/printer_data/config/moonraker.conf <<'EOF'
####################################################################
# Moonraker configuration for Creality K1C (K1C-4255)
#
# Moonraker is the API server that sits between Klipper and the web
# UI (Mainsail / Fluidd / mobile apps). It exposes HTTP + WebSocket
# on port 7125 and talks to Klipper over a Unix domain socket.
#
# After editing this file, restart Moonraker:
#   /etc/init.d/S56moonraker_service restart
#
# Follow the log while testing:
#   tail -f /usr/data/printer_data/logs/moonraker.log
####################################################################


####################################################################
# [server]  Core HTTP / WebSocket server settings
####################################################################
[server]
# Bind address. 0.0.0.0 = listen on all interfaces (LAN + Tailscale).
# Use 127.0.0.1 if you only ever reach it through a reverse proxy.
host: 0.0.0.0

# HTTP port. Web UIs and mobile apps connect here by default.
port: 7125

# Where Klipper's Unix domain socket lives. Klipper creates this
# socket; Moonraker connects to it. Must match the value in
# /usr/data/printer_data/config/printer.cfg (or the Klipper cmdline).
klippy_uds_address: /tmp/klippy_uds

# Maximum size (MB) for a single file upload through the API.
# 2048 = 2 GB, enough for big gcode files.
max_upload_size: 2048


####################################################################
# [file_manager]  Gcode file handling and metadata
####################################################################
[file_manager]
# If True, uploads are queued and processed one at a time. Useful on
# slow storage; False lets Moonraker handle them concurrently.
queue_gcode_uploads: False

# If True, Moonraker parses gcode to extract metadata (estimated
# print time, filament usage, thumbnails). Leave True for slicer
# previews in Mainsail/Fluidd.
enable_object_processing: True


####################################################################
# [database]  SQLite database for history, job queue, etc.
####################################################################
[database]
# No options needed here. Moonraker auto-creates
# /usr/data/printer_data/database/moonraker.db on first run.
# Add 'database_path:' here only if you want to relocate it.


####################################################################
# [data_store]  In-memory rolling buffers for sensors and gcode
####################################################################
[data_store]
# How many temperature samples to keep per sensor (~10s apart).
# 600 samples * 10s = ~100 minutes of history for the temp graph.
temperature_store_size: 600

# How many lines of gcode console output to keep in memory.
# Larger = more scrollback in the UI, more RAM used.
gcode_store_size: 1000


####################################################################
# [machine]  Service / system info provider
####################################################################
[machine]
# K1 series uses supervisord to manage klipper/moonraker, not
# systemd. This provider reads supervisord's control socket so
# Moonraker can report service status and restart them.
provider: supervisord_cli

# On K1C the supervisord service names don't match what Moonraker
# expects, so service validation is disabled. These produce
# "Unable to locate service info" lines in the log — harmless.
validate_service: False
validate_config: False


####################################################################
# [job_queue]  Print queue (queue multiple jobs back-to-back)
####################################################################
[job_queue]
# Re-load any saved queue when Moonraker starts.
load_on_startup: True

# Automatically start the next job when the current one finishes.
automatic_transition: True

# Seconds to wait between finishing one job and starting the next.
job_transition_delay: 0.5


####################################################################
# [authorization]  Users, trusted clients, CORS
#
# THIS IS THE SECTION THAT WAS BREAKING YOUR WEB UI.
#
# With force_logins: True, every client that is NOT in
# trusted_clients must authenticate with a user account. Your PC
# (192.168.1.237) and phone (192.168.1.226) weren't in the list,
# which caused the endless "Websocket Failed Authentication: HTTP
# 401" loop.
#
# Two ways to fix it:
#   A) Add your LAN subnet to trusted_clients (quick, less secure)
#   B) Create a user via the API and log in (secure, recommended)
#
# You chose Option B, so a user needs to be created ONCE via curl
# after the first restart. See notes at the bottom of this file.
####################################################################
[authorization]
# Require login for anything not explicitly trusted.
# Keep this True on any network you don't fully control.
force_logins: True

# Bootstrap API key. Needed ONLY to create your first user. Once
# you have a user and can log in through the UI, you can delete
# this line. Keep it if you want to script against the API.
# Generate a new one with:
#   head -c 32 /dev/urandom | hexdump -e '"%x"'; echo
api_key: 8f3c1e2a9b7d4f6e0a1c5b8d2e4f7a9c

# Origins allowed to make cross-origin requests to Moonraker.
# Each entry must be an exact origin or a wildcard subdomain.
# Add your reverse-proxy / Home Assistant origins here.
cors_domains:
  # Local mDNS / LAN hostnames
  *.lan
  *.local
  *.ts.net
  # Localhost (any port) for same-host tools
  *://localhost
  *://localhost:*
  # Cloud UIs hosted elsewhere
  *://my.mainsail.xyz
  *://app.fluidd.xyz
  # Home Assistant on your LAN
  http://192.168.1.15:8123
  https://192.168.1.15:8123
  http://homeassistant.local:8123
  # Reverse proxy on the printer itself
  http://192.168.1.251:4409
  https://192.168.1.251:4409

# Clients that bypass authentication entirely.
# Keep this list as tight as possible — every entry is a full
# admin credential to your printer.
trusted_clients:
  # Loopback & IPv6 link-local (required for local tools)
  127.0.0.1/32
  ::1/128
  FE80::/10
  # Specific LAN hosts you already trust (existing entries)
  192.168.1.15/32
  192.168.1.251/32
  # OPTION A: to trust the whole LAN instead of creating users,
  # uncomment the next line and remove the user-creation step:
  #192.168.1.0/24
  # Tailscale CGNAT range (clients via subnet router)
  100.64.0.0/10
  # Tailscale IPv6 range
  fd7a:115c:a1e0::/48


####################################################################
# [octoprint_compat]  OctoPrint-compatible API endpoints
# Lets OctoPrint clients (e.g. some slicers) talk to Moonraker as
# if it were OctoPrint. No options.
####################################################################
[octoprint_compat]


####################################################################
# [history]  Print history / job totals
# Backed by the [database] component. No options required, but you
# can add 'batch_size:' or 'history_size:' here if desired.
####################################################################
[history]


####################################################################
# [update_manager]  Update checking for Moonraker, Klipper, UIs
####################################################################
[update_manager]
# Check for updates automatically in the background.
enable_auto_refresh: True

# How often to check, in hours. 168 = once a week.
refresh_interval: 168

# Allow Moonraker to update system packages (apt etc.).
# Disabled because the K1C rootfs is not a normal Debian install.
enable_system_updates: False


####################################################################
# [update_manager Creality-Helper-Script]  Update the helper script
####################################################################
[update_manager Creality-Helper-Script]
type: git_repo
channel: dev
path: /usr/data/helper-script
origin: https://github.com/Guilouz/Creality-Helper-Script.git
primary_branch: main
managed_services: klipper


####################################################################
# [update_manager mainsail]  Update the Mainsail web UI
####################################################################
[update_manager mainsail]
type: web
channel: stable
repo: mainsail-crew/mainsail
path: /usr/data/mainsail


# Optional components — uncomment if you install them.
#
#[update_manager fluidd]
#type: web
#channel: stable
#repo: fluidd-core/fluidd
#path: /usr/data/fluidd
#
#[update_manager mobileraker]
#type: git_repo
#path: /usr/data/mobileraker_companion
#origin: https://github.com/Clon1998/mobileraker_companion.git
#virtualenv: /usr/data/mobileraker-env
#primary_branch: main
#requirements: scripts/mobileraker-requirements.txt
#install_script: scripts/install.sh
#managed_services: mobileraker


####################################################################
# [webcam Camera]  MJPEG webcam exposed to the UI
####################################################################
[webcam Camera]
# 'printer' shows the stream on the printer page; 'settings' would
# hide it from the printer view. Keep 'printer'.
location: printer
enabled: True

# Service type: mjpegstreamer, mjpegstreamer-adaptive, uv4l-mjpeg,
# or iframe. Your K1C helper-script setup uses mjpegstreamer.
service: mjpegstreamer

# Frame rates.
target_fps: 15
target_fps_idle: 5

# URLs the browser will load for stream and snapshot. Must be
# reachable from the client's browser, not just from the printer.
stream_url: http://192.168.1.251:8080/?action=stream
snapshot_url: http://192.168.1.251:8080/?action=snapshot

# Orientation.
flip_horizontal: False
flip_vertical: False
rotation: 0

# Display aspect ratio in the UI.
aspect_ratio: 4:3
EOF