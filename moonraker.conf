# =============================================================================
# Moonraker configuration for Creality K1C
# Printer IP: 192.168.1.251
# Home Assistant IP: 192.168.1.157
# Installed with: Guilouz Creality Helper Script
# Tailscale: Home Assistant is advertising 192.168.1.0/24 as a subnet router
#
# This file matches the current working setup:
#   - Moonraker HTTP on port 7125
#   - Webcam accessed directly at http://192.168.1.251:8080
#   - Mainsail / Fluidd on port 4409
#
# After a firmware update, re-upload this file to:
#   /usr/data/printer_data/config/moonraker.conf
# Then restart Moonraker:
#   sudo systemctl restart moonraker
# =============================================================================

[server]
host: 0.0.0.0
port: 7125
# SSL is NOT enabled yet. To enable self-signed HTTPS:
#   1. Generate certs in /usr/data/printer_data/config/certs/
#   2. Uncomment the line below
#   3. Add https://192.168.1.251:7130 to cors_domains
#   4. Restart Moonraker
# ssl_port: 7130
klippy_uds_address: /tmp/klippy_uds
max_upload_size: 2048

[file_manager]
queue_gcode_uploads: False
enable_object_processing: True

[database]

[data_store]
temperature_store_size: 600
gcode_store_size: 1000

[machine]
provider: supervisord_cli
validate_service: False
validate_config: False

[job_queue]
load_on_startup: True
automatic_transition: True
job_transition_delay: 0.5

[authorization]
force_logins: True

cors_domains:
  # Local and Tailscale domains
  *.lan
  *.local
  *.ts.net
  *://localhost
  *://localhost:*
  *://my.mainsail.xyz
  *://app.fluidd.xyz

  # Home Assistant
  http://192.168.1.157:8123
  https://192.168.1.157:8123
  http://homeassistant.local:8123

  # Mainsail / Fluidd on the K1C
  http://192.168.1.251:4409
  https://192.168.1.251:4409

  # Uncomment when Moonraker SSL is enabled on port 7130
  # https://192.168.1.251:7130

trusted_clients:
  # Loopback & link-local
  127.0.0.1/32
  ::1/128
  FE80::/10

  # Local network hosts
  192.168.1.157/32
  192.168.1.251/32

  # Tailscale CGNAT range (clients via subnet router)
  100.64.0.0/10

  # Tailscale IPv6 range
  fd7a:115c:a1e0::/48

[octoprint_compat]

[history]

[update_manager]
enable_auto_refresh: True
refresh_interval: 168
enable_system_updates: False

[update_manager Creality-Helper-Script]
type: git_repo
channel: dev
path: /usr/data/helper-script
origin: https://github.com/Guilouz/Creality-Helper-Script.git
primary_branch: main
managed_services: klipper

[webcam Camera]
location: printer
enabled: True
service: mjpegstreamer
target_fps: 15
target_fps_idle: 5

# Direct webcam access. This works with the current setup.
stream_url: http://192.168.1.251:8080/?action=stream
snapshot_url: http://192.168.1.251:8080/?action=snapshot

# If you later set up the nginx /webcam/ reverse proxy:
#   - Comment the two direct URLs above
#   - Uncomment the two relative URLs below
# stream_url: /webcam/?action=stream
# snapshot_url: /webcam/?action=snapshot

flip_horizontal: False
flip_vertical: False
rotation: 0
aspect_ratio: 4:3

[update_manager mainsail]
type: web
channel: stable
repo: mainsail-crew/mainsail
path: /usr/data/mainsail

# Optional: Fluidd
#[update_manager fluidd]
#type: web
#channel: stable
