# moonraker.conf
#
# SSL / HTTPS:
#   Before enabling SSL, generate a self-signed certificate:
#     mkdir -p /usr/data/printer_data/certs
#     openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#       -keyout /usr/data/printer_data/certs/moonraker.key \
#       -out /usr/data/printer_data/certs/moonraker.cert \
#       -subj "/CN=moonraker.local"
#
#   After restarting Moonraker, point Mainsail/Fluidd at:
#     https://192.168.1.251:7130
#     wss://192.168.1.251:7130/websocket

[server]
host: 0.0.0.0
port: 7125
ssl_port: 7130
ssl_certificate_path: /usr/data/printer_data/certs/moonraker.cert
ssl_key_path: /usr/data/printer_data/certs/moonraker.key
klippy_uds_address: /tmp/klippy_uds
max_upload_size: 2048

[file_manager]
queue_gcode_uploads: False
enable_object_processing: True

[database]

[data_store]
temperature_store_size: 600
gcode_store_size: 1000

[machine]
provider: supervisord_cli
validate_service: False
validate_config: False

[job_queue]
load_on_startup: True
automatic_transition: True
job_transition_delay: 0.5

[authorization]
# force_logins: True means any client NOT listed in trusted_clients
# must authenticate with a username/password.
force_logins: True

# CORS: browser origins allowed to call Moonraker.
cors_domains:
  *.lan
  *.local
  *.ts.net
  *://localhost
  *://localhost:*
  *://my.mainsail.xyz
  *://app.fluidd.xyz
  http://homeassistant.local:8123
  http://192.168.1.251:4409
  https://192.168.1.251:4409

# trusted_clients bypass login even with force_logins: True.
# Keep this minimal. Local LAN devices will be asked to log in unless added here.
trusted_clients:
  # Loopback & link-local
  127.0.0.1/32
  ::1/128
  FE80::/10
  # If you want a LAN device to skip login, add it here, e.g.:
  # 192.168.1.226/32   # pixel-9-pro LAN
  # 192.168.1.168/32   # todd-tab-s9-fs LAN
  #
  # WARNING: Do NOT add 192.168.1.157 while Tailscale SNAT is enabled.
  # With snat_subnet_routes: true, every Tailscale client appears as the
  # Home Assistant LAN IP, so adding it here would bypass login for all remote users.

[octoprint_compat]

[history]

[update_manager]
enable_auto_refresh: True
refresh_interval: 168
enable_system_updates: False

[update_manager Creality-Helper-Script]
type: git_repo
channel: dev
path: /usr/data/helper-script
origin: https://github.com/Guilouz/Creality-Helper-Script.git
primary_branch: main
managed_services: klipper

[webcam Camera]
location: printer
enabled: True
service: mjpegstreamer
target_fps: 15
target_fps_idle: 5
# These URLs must point at the Nginx HTTPS reverse proxy, not the raw HTTP stream.
stream_url: https://192.168.1.251:8443/?action=stream
snapshot_url: https://192.168.1.251:8443/?action=snapshot
flip_horizontal: False
flip_vertical: False
rotation: 0
aspect_ratio: 4:3

[update_manager mainsail]
type: web
channel: stable
repo: mainsail-crew/mainsail
path: /usr/data/mainsail

# Optional: Fluidd
#[update_manager fluidd]
