# =============================================================================
# gcode_macro.cfg - K1C
#
# Chamber exhaust fan handling (v2026-09-25):
#   * The K1C exhaust fan is [output_pin fan1] on PC0.
#   * The chamber thermistor is [temperature_sensor chamber_temp] on PC5.
#   * There is NO [temperature_fan chamber_fan] section. Adding one caused
#     "pin PC0 used multiple times".
#   * Chamber exhaust is TEMPERATURE-CONTROLLED by a watchdog:
#       - _CHAMBER_FAN_CONTROL   stores target temp + enable flag
#       - _CHAMBER_FAN_WATCHDOG  polls chamber_temp and toggles fan1
#       - M141 S<temp>           sets the target and enables the watchdog
#   * ABS/ASA -> START_PRINT sends M141 S50 -> fan only runs above 50 C
#     (with 3 C hysteresis, so off again below 47 C).
#   * PLA/PETG/TPU -> START_PRINT sends M141 S35 -> fan above 35 C.
#   * END_PRINT disables the watchdog and forces fan1 off.
#
# PRTouch bed mesh constraint (v2026-09-25):
#   * Creality's prtouch_v1_wrapper.py hardcodes the mesh point count based on
#     [bed_mesh] probe_count: 5,5. Passing a runtime PROBE_COUNT to
#     BED_MESH_CALIBRATE causes:
#       IndexError: list index out of range
#     in bed_mesh_post_proc, surfacing as:
#       {"code":"key60","msg":"Internal error on command:BED_MESH_CALIBRATE"}
#   * BED_MESH_CALIBRATE itself is wrapped: PROBE_COUNT is stripped from any
#     caller. All other parameters (MESH_MIN, MESH_MAX, METHOD, etc.) pass
#     through unchanged.
#   * Adaptive mesh still adapts MESH_MIN / MESH_MAX boundaries; only the
#     probe point count is fixed at 5x5.
#
# Renamed-command naming convention (v2026-09-25):
#   * Klipper's G-code parser only allows dots in M-code sub-indexes
#     (M204.1, M117.2, ...). Named commands are restricted to
#     [a-zA-Z_][a-zA-Z0-9_]+.
#   * Therefore every rename_existing target uses the underscore-prefixed
#     form: _BED_MESH_CALIBRATE_ORIG, _M204_ORIG, etc.
#   * Using a dot in a named command produces:
#       {"code":"key513","msg":"Malformed command 'NAME.1 ...'"}
# =============================================================================

# =============================================================================
# PRINTER_PARAM - central parameter store used across all macros.
# =============================================================================
[gcode_macro PRINTER_PARAM]
variable_z_safe_pause: 0.0
variable_z_safe_g28: 3.0
variable_max_x_position: 220.0
variable_max_y_position: 220.0
variable_max_z_position: 250.0
variable_fans: 3
variable_auto_g29: 0
variable_fan0_min: 25
variable_fan1_min: 50
variable_fan2_min: 180
variable_fan2_speed: 0
variable_hotend_temp: 0
variable_e_min_current: 0.27
variable_cam_off_temp: 60
gcode:

[gcode_macro AUTOTUNE_SHAPERS]
variable_autotune_shapers: 'ei'
gcode:

[gcode_macro LOAD_MATERIAL_CLOSE_FAN2]
variable_fan2_value: 0
gcode:
  SAVE_GCODE_STATE NAME=myMoveState
  {% if printer['output_pin fan2'].value > 0.0 %}
    SET_GCODE_VARIABLE MACRO=LOAD_MATERIAL_CLOSE_FAN2 VARIABLE=fan2_value VALUE={printer['output_pin fan2'].value}
    M107 P2
  {% endif %}
  RESTORE_E_CURRENT

[gcode_macro LOAD_MATERIAL_RESTORE_FAN2]
gcode:
  {% set fan2_value = printer['gcode_macro LOAD_MATERIAL_CLOSE_FAN2'].fan2_value|float %}
  RESTORE_GCODE_STATE NAME=myMoveState
  {% if fan2_value > 0.0 %}
    {% set s_value = (fan2_value * 255 - printer["gcode_macro PRINTER_PARAM"].fan2_min) * 255 / (255 - printer["gcode_macro PRINTER_PARAM"].fan2_min) %}
    M106 P2 S{s_value}
    SET_GCODE_VARIABLE MACRO=LOAD_MATERIAL_CLOSE_FAN2 VARIABLE=fan2_value VALUE=0
  {% endif %}
  SET_E_MIN_CURRENT

[gcode_macro SET_E_MIN_CURRENT]
gcode:
  {% set e_current = printer['gcode_macro PRINTER_PARAM'].e_min_current %}
  M400
  SET_TMC_CURRENT STEPPER=extruder CURRENT={e_current} HOLDCURRENT={e_current}
  G4 P2000

[gcode_macro RESTORE_E_CURRENT]
gcode:
  {% set e_current = printer.configfile.settings['tmc2209 extruder'].run_current %}
  M400
  SET_TMC_CURRENT STEPPER=extruder CURRENT={e_current} HOLDCURRENT={e_current}
  G4 P2000

[gcode_macro LOAD_MATERIAL]
gcode:
  LOAD_MATERIAL_CLOSE_FAN2
  M109 S{printer.custom_macro.default_extruder_temp}
  G91
  G1 E80 F180
  LOAD_MATERIAL_RESTORE_FAN2

[gcode_macro QUIT_MATERIAL]
gcode:
  SAVE_GCODE_STATE NAME=myMoveState
  RESTORE_E_CURRENT
  M109 S{printer.custom_macro.default_extruder_temp}
  M83
  G1 E100 F300
  G1 E-15 F3000
  G1 E-22.4700 F2400
  G1 E-6.4200 F1200
  G1 E-3.2100 F720
  G1 E5.0000 F356
  G1 E-5.0000 F384
  G1 E5.0000 F412
  G1 E-5.0000 F440
  G1 E5.0000 F467
  G1 E-5.0000 F495
  G1 E5.0000 F523
  G1 E-5.0000 F3000
  G1 E-15 F3000
  SET_E_MIN_CURRENT
  RESTORE_GCODE_STATE NAME=myMoveState

[gcode_macro Qmode]
variable_flag: 0
variable_accel: 0
variable_accel_to_decel: 0
variable_velocity: 0
variable_square_corner_velocity: 0
variable_pressure_advance:0.0
variable_fan0_value: 0.00
variable_fan1_value: 0.00
variable_fan2_value: 0.00
variable_speed_factor: 0
variable_max_accel: 2500
variable_max_accel_to_decel: 2500
gcode:
  {% set printer_state = printer.print_stats.state %}
  {% if printer['gcode_macro Qmode'].flag|int == 0 %}
    {% if printer_state == "printing" or printer_state == "paused" %}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=accel VALUE={printer.toolhead.max_accel}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=accel_to_decel VALUE={printer.toolhead.max_accel_to_decel}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=velocity VALUE={printer.toolhead.max_velocity}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=square_corner_velocity VALUE={printer.toolhead.square_corner_velocity}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=pressure_advance VALUE={printer.extruder.pressure_advance}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=speed_factor VALUE={printer.gcode_move.speed_factor}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan0_value VALUE={printer['output_pin fan0'].value}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan1_value VALUE={printer['output_pin fan1'].value}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan2_value VALUE={printer['output_pin fan2'].value}
      SET_TMC_FIELD STEPPER=stepper_x FIELD=en_spreadcycle VALUE=0
      SET_TMC_FIELD STEPPER=stepper_y FIELD=en_spreadcycle VALUE=0

      SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1.0
      SET_TMC_CURRENT STEPPER=stepper_y CURRENT=1.0
      G4 P1000

      SET_VELOCITY_LIMIT ACCEL=2500
      SET_VELOCITY_LIMIT ACCEL_TO_DECEL=2500
      SET_VELOCITY_LIMIT VELOCITY=150
      SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=5
      SET_PRESSURE_ADVANCE ADVANCE=0.05
      M220 S50

      {% set tmp = printer['output_pin fan0'].value * 255 %}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan0_value VALUE={tmp}
      {% if tmp - printer['gcode_macro PRINTER_PARAM'].fan0_min > (255 - printer['gcode_macro PRINTER_PARAM'].fan0_min) / 2 %}
        {% set tmp = printer['gcode_macro PRINTER_PARAM'].fan0_min + (255 - printer['gcode_macro PRINTER_PARAM'].fan0_min) / 2 %}
        SET_PIN PIN=fan0 VALUE={tmp}
      {% endif %}

      {% set tmp = printer['output_pin fan1'].value * 255 %}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan1_value VALUE={printer['output_pin fan1'].value * 255}
      {% if tmp - printer['gcode_macro PRINTER_PARAM'].fan1_min > (255 - printer['gcode_macro PRINTER_PARAM'].fan1_min) / 2 %}
        {% set tmp = printer['gcode_macro PRINTER_PARAM'].fan1_min + (255 - printer['gcode_macro PRINTER_PARAM'].fan1_min) / 2 %}
        SET_PIN PIN=fan1 VALUE={tmp}
      {% endif %}

      {% set tmp = printer['output_pin fan2'].value * 255 %}
      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan2_value VALUE={printer['output_pin fan2'].value * 255}
      {% if tmp - printer['gcode_macro PRINTER_PARAM'].fan2_min > (255 - printer['gcode_macro PRINTER_PARAM'].fan2_min) / 2 %}
        {% set tmp = printer['gcode_macro PRINTER_PARAM'].fan2_min + (255 - printer['gcode_macro PRINTER_PARAM'].fan2_min) / 2 %}
        SET_PIN PIN=fan2 VALUE={tmp}
      {% endif %}

      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=flag VALUE=1
      SET_QMODE_FLAG FLAG=1
    {% endif %}
  {% endif %}

[gcode_macro Qmode_exit]
gcode:
  {% set printer_state = printer.print_stats.state %}
  {% if printer['gcode_macro Qmode'].flag|int == 1 %}
    {% if printer_state == "printing" or printer_state == "paused" %}
      SET_VELOCITY_LIMIT ACCEL={printer['gcode_macro Qmode'].accel}
      SET_VELOCITY_LIMIT ACCEL_TO_DECEL={printer['gcode_macro Qmode'].accel_to_decel}
      SET_VELOCITY_LIMIT VELOCITY={printer['gcode_macro Qmode'].velocity}
      SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={printer['gcode_macro Qmode'].square_corner_velocity}
      SET_PRESSURE_ADVANCE ADVANCE={printer['gcode_macro Qmode'].pressure_advance}
      M220 S{printer['gcode_macro Qmode'].speed_factor * 100}

      {% set X_RUN_CUR = printer.configfile.settings['tmc2209 stepper_x'].run_current %}
      {% set Y_RUN_CUR = printer.configfile.settings['tmc2209 stepper_y'].run_current %}
      SET_TMC_CURRENT STEPPER=stepper_x CURRENT={X_RUN_CUR}
      SET_TMC_CURRENT STEPPER=stepper_y CURRENT={Y_RUN_CUR}

      SET_TMC_FIELD STEPPER=stepper_x FIELD=en_spreadcycle VALUE=1
      SET_TMC_FIELD STEPPER=stepper_y FIELD=en_spreadcycle VALUE=1
      G4 P1000

      SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=flag VALUE=0
      SET_QMODE_FLAG FLAG=0

      {% if printer['output_pin fan0'].value != 0 %}
        {action_respond_info("fan0_value = %s" % printer['gcode_macro Qmode'].fan0_value)}
        SET_PIN PIN=fan0 VALUE={printer['gcode_macro Qmode'].fan0_value}
        SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan0_value VALUE=0
      {% endif %}
      {% if printer['output_pin fan1'].value != 0 %}
        {action_respond_info("fan1_value = %s" % printer['gcode_macro Qmode'].fan1_value)}
        SET_PIN PIN=fan1 VALUE={printer['gcode_macro Qmode'].fan1_value}
        SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan1_value VALUE=0
      {% endif %}
      {% if printer['output_pin fan2'].value != 0 %}
        {action_respond_info("fan2_value = %s" % printer['gcode_macro Qmode'].fan2_value)}
        SET_PIN PIN=fan2 VALUE={printer['gcode_macro Qmode'].fan2_value}
        SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan2_value VALUE=0
      {% endif %}
    {% endif %}
  {% endif %}

# =============================================================================
# M204 wrapper
#
# Intercepts M204 (set acceleration) and clamps its value while Qmode is
# active. The original M204 command is renamed to _M204_ORIG using the
# underscore-prefixed convention.
#
# WHY NOT M204.1: Klipper's parser does technically accept M-code sub-indexes
# like M204.1, but the underscore form is preferred because it:
#   * Is the recommended Klipper project convention for renamed commands.
#   * Is consistent with every other rename_existing in this file
#     (_BED_MESH_CALIBRATE_ORIG, _M600_ORIG, _PAUSE_ORIG, etc.).
#   * Cannot be confused with a real M-code sub-index by slicers or by
#     future Klipper parsing changes.
# =============================================================================
[gcode_macro M204]
rename_existing: _M204_ORIG
gcode:
    {% set get_params = "" %}
    {% set qmode_max_accel = printer['gcode_macro Qmode'].max_accel|string %}
    {% if 'S' in params|upper %}
      {% if printer['gcode_macro Qmode'].flag|int == 1 and params.S|float > qmode_max_accel|float %}
        {% set get_params = (get_params + ' ' + 'S' + qmode_max_accel) %}
      {% else %}
        {% set get_params = (get_params + ' ' + 'S' + params.S) %}
      {% endif %}
    {% endif %}
    {% if 'P' in params|upper %}
      {% if printer['gcode_macro Qmode'].flag|int == 1 and params.P|float > qmode_max_accel|float %}
        {% set get_params = (get_params + ' ' + 'P' + qmode_max_accel) %}
      {% else %}
        {% set get_params = (get_params + ' ' + 'P' + params.P) %}
      {% endif %}
    {% endif %}
    {% if 'T' in params|upper %}
      {% if printer['gcode_macro Qmode'].flag|int == 1 and params.T|float > qmode_max_accel|float %}
        {% set get_params = (get_params + ' ' + 'T' + qmode_max_accel) %}
      {% else %}
        {% set get_params = (get_params + ' ' + 'T' + params.T) %}
      {% endif %}
    {% endif %}
    _M204_ORIG {get_params}

[gcode_macro M205]
gcode:
  {% if 'X' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.X}
  {% elif 'Y' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.Y}
  {% endif %}

[gcode_macro M106]
gcode:
  {% set fans = printer["gcode_macro PRINTER_PARAM"].fans|int %}
  {% set fan = 0 %}
  {% set value = 0 %}
  {% if params.P is defined %}
    {% set tmp = params.P|int %}
    {% if tmp < fans %}
      {% set fan = tmp %}
    {% endif %}
  {% endif %}
  {% if params.S is defined %}
    {% set tmp = params.S|float %}
  {% else %}
    {% set tmp = 255 %}
  {% endif %}
  {% if tmp > 0 %}
    {% if fan == 0 %}
      {% set value = (255 - printer["gcode_macro PRINTER_PARAM"].fan0_min) / 255 * tmp %}
      {% if printer['gcode_macro Qmode'].flag | int == 1 %}
        SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan0_value VALUE={printer["gcode_macro PRINTER_PARAM"].fan0_min + value}
        {% if value > (255 - printer['gcode_macro PRINTER_PARAM'].fan0_min) / 2  %}
          {% set value = printer["gcode_macro PRINTER_PARAM"].fan0_min + (255 - printer['gcode_macro PRINTER_PARAM'].fan0_min) / 2 %}
        {% else %}
          {% set value = printer["gcode_macro PRINTER_PARAM"].fan0_min + value %}
        {% endif %}
      {% else %}
        {% set value = printer["gcode_macro PRINTER_PARAM"].fan0_min + value %}
      {% endif %}
    {% endif %}
    {% if fan == 1 %}
      {% set value = (255 - printer["gcode_macro PRINTER_PARAM"].fan1_min) / 255 * tmp %}
      {% if printer['gcode_macro Qmode'].flag | int == 1 %}
        SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan1_value VALUE={printer["gcode_macro PRINTER_PARAM"].fan1_min + value}
        {% if value > (255 - printer['gcode_macro PRINTER_PARAM'].fan1_min) / 2  %}
          {% set value = printer["gcode_macro PRINTER_PARAM"].fan1_min + (255 - printer['gcode_macro PRINTER_PARAM'].fan1_min) / 2 %}
        {% else %}
          {% set value = printer["gcode_macro PRINTER_PARAM"].fan1_min + value %}
        {% endif %}
      {% else %}
        {% set value = printer["gcode_macro PRINTER_PARAM"].fan1_min + value %}
      {% endif %}
    {% endif %}
    {% if fan == 2 %}
      {% set value = (255 - printer["gcode_macro PRINTER_PARAM"].fan2_min) / 255 * tmp %}
      {% if printer['gcode_macro Qmode'].flag | int == 1 %}
        SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan2_value VALUE={printer["gcode_macro PRINTER_PARAM"].fan2_min + value}
        {% if value > (255 - printer['gcode_macro PRINTER_PARAM'].fan2_min) / 2  %}
          {% set value = printer["gcode_macro PRINTER_PARAM"].fan2_min + (255 - printer['gcode_macro PRINTER_PARAM'].fan2_min) / 2 %}
        {% else %}
          {% set value = printer["gcode_macro PRINTER_PARAM"].fan2_min + value %}
        {% endif %}
      {% else %}
        {% set value = printer["gcode_macro PRINTER_PARAM"].fan2_min + value %}
      {% endif %}
    {% endif %}
  {% endif %}
  {% if value >= 255 %}
    {% set value = 255 %}
  {% endif %}
  SET_PIN PIN=fan{fan} VALUE={value}

[gcode_macro M107]
gcode:
  {% set fans = printer["gcode_macro PRINTER_PARAM"].fans|int %}
  {% if params.P is defined %}
    {% if params.P|int < fans %}
      SET_PIN PIN=fan{params.P|int} VALUE=0
    {% else %}
      SET_PIN PIN=fan0 VALUE=0
    {% endif %}
  {% else %}
    SET_PIN PIN=fan0 VALUE=0
    SET_PIN PIN=fan2 VALUE=0
  {% endif %}

# =============================================================================
# Chamber exhaust fan temperature controller
# =============================================================================
[gcode_macro _CHAMBER_FAN_CONTROL]
variable_target_temp: 0      # C, 0 = disabled
variable_hysteresis:  3      # C, turn-off band below target
variable_enabled:     0      # 1 = watchdog active
gcode:

[delayed_gcode _CHAMBER_FAN_WATCHDOG]
# First tick 5 s after Klipper is ready; then every 3 s forever.
initial_duration: 5
gcode:
  UPDATE_DELAYED_GCODE ID=_CHAMBER_FAN_WATCHDOG DURATION=3

  {% set enabled = printer['gcode_macro _CHAMBER_FAN_CONTROL'].enabled|int %}
  {% if enabled == 1 %}
    {% set target  = printer['gcode_macro _CHAMBER_FAN_CONTROL'].target_temp|float %}
    {% set hyst    = printer['gcode_macro _CHAMBER_FAN_CONTROL'].hysteresis|float %}
    {% set chamber = printer['temperature_sensor chamber_temp'].temperature|float %}
    {% set fan_on  = printer['output_pin fan1'].value|float > 0.5 %}

    {% if target > 0 %}
      {% if chamber >= target and not fan_on %}
        SET_PIN PIN=fan1 VALUE=255
        RESPOND TYPE=command MSG="Chamber {chamber}C >= {target}C -> exhaust fan ON"
      {% elif chamber <= (target - hyst) and fan_on %}
        SET_PIN PIN=fan1 VALUE=0
        RESPOND TYPE=command MSG="Chamber {chamber}C <= {target - hyst}C -> exhaust fan OFF"
      {% endif %}
    {% endif %}
  {% endif %}

# -----------------------------------------------------------------------------
# M141 - set the chamber target temperature for the exhaust fan controller.
# -----------------------------------------------------------------------------
[gcode_macro M141]
description: Set chamber target temperature (exhaust on above this value)
gcode:
  {% if 'S' in params|upper %}
    {% set s = params.S|int %}
    {% if s > 0 %}
      SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN_CONTROL VARIABLE=target_temp VALUE={s}
      SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN_CONTROL VARIABLE=enabled     VALUE=1
      RESPOND TYPE=command MSG="Chamber fan target = {s}C (auto ON above target)"
    {% else %}
      SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN_CONTROL VARIABLE=enabled VALUE=0
      SET_PIN PIN=fan1 VALUE=0
      RESPOND TYPE=command MSG="Chamber fan disabled"
    {% endif %}
  {% endif %}

[gcode_macro M900]
gcode:
  {% if 'K' in params %}
    {% if 'E' in params %}
      SET_PRESSURE_ADVANCE EXTRUDER={params.E} ADVANCE={params.K}
    {% else %}
      SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}
  {% endif %}

[delayed_gcode wait_temp]
gcode:
  {% set cur_temp = printer.extruder.temperature %}
  {% if cur_temp|int < 40 %}
    WAIT_TEMP_END
  {% else %}
    UPDATE_DELAYED_GCODE ID=wait_temp DURATION=5
  {% endif %}

[gcode_macro WAIT_TEMP_START]
gcode:
  {action_respond_info("wait temp start\n")}
  UPDATE_DELAYED_GCODE ID=wait_temp DURATION=1
  M106 P0 S255

[gcode_macro WAIT_TEMP_END]
gcode:
  {action_respond_info("wait temp end\n")}
  UPDATE_DELAYED_GCODE ID=wait_temp DURATION=0
  M106 P0 S0

[gcode_macro PRINT_CALIBRATION]
gcode:
  CX_PRINT_LEVELING_CALIBRATION

[gcode_macro FIRST_FLOOR_PAUSE_POSITION]
gcode:
  {% set extruder_temp = printer.custom_macro.g28_ext_temp %}
  M104 S{extruder_temp}
  {% set y_park = printer.toolhead.axis_maximum.y/2 %}
  {% set x_park = printer['gcode_macro PRINTER_PARAM'].max_x_position|float + 1 %}
  G90
  G1 Z2 F600
  G1 X{x_park} Y{y_park} F6000
  G1 Z0.2 F600

[gcode_macro ACCURATE_G28]
gcode:
  ACCURATE_HOME_Z

# =============================================================================
# START_PRINT - entry point for every print job (called by OrcaSlicer).
#
# PRTouch constraint: PROBE_COUNT is NOT passed to BED_MESH_CALIBRATE.
# The prtouch_v1_wrapper.py uses a fixed point count from [bed_mesh]
# probe_count: 5,5.
#
# Adaptive mesh still adapts the MESH_MIN / MESH_MAX boundaries; only the
# number of probe points is fixed at 5x5.
# =============================================================================
[gcode_macro START_PRINT]
variable_prepare: 0
gcode:
  WAIT_TEMP_END
  CLEAR_PAUSE

  {% set g28_extruder_temp = printer.custom_macro.g28_ext_temp %}
  {% set bed_temp = printer.custom_macro.default_bed_temp %}
  {% set extruder_temp = printer.custom_macro.default_extruder_temp %}

  {% if 'BED_TEMP' in params|upper and (params.BED_TEMP|float) %}
    {% set bed_temp = params.BED_TEMP %}
  {% endif %}

  {% if 'EXTRUDER_TEMP' in params|upper and (params.EXTRUDER_TEMP|float) %}
    {% set extruder_temp = params.EXTRUDER_TEMP %}
  {% endif %}

  # ============================================================
  # Chamber exhaust fan target
  # ============================================================
  {% set ftype = params.FILAMENT_TYPE|default("")|upper %}
  {% set chamber_temp = params.CHAMBER_TEMP|default(0)|int %}
  {% if chamber_temp == 0 %}
    {% if ftype in ["ABS", "ASA"] %}
      {% set chamber_temp = 50 %}
    {% else %}
      {% set chamber_temp = 35 %}
    {% endif %}
  {% endif %}
  {action_respond_info("Chamber fan target: %sC (filament: %s)" % (chamber_temp, ftype))}
  M141 S{chamber_temp}

  # ============================================================
  # HEAT #1: Full print temperature.
  # ============================================================
  RESPOND TYPE=command MSG="Heating hotend to {extruder_temp}C before print prep..."
  M109 S{extruder_temp}

  # ============================================================
  # Suspend persisted gcode Z-offset BEFORE any movement macro runs.
  # ============================================================
  ZOFFSET_CLEAR

  # ============================================================
  # Apply skew correction profile if it exists.
  # ============================================================
  SKEW_PROFILE LOAD=default

  # ============================================================
  # Adaptive / Full Bed Mesh
  # ============================================================
  {% set bed_min_x = printer.configfile.settings.bed_mesh.mesh_min[0]|float %}
  {% set bed_min_y = printer.configfile.settings.bed_mesh.mesh_min[1]|float %}
  {% set bed_max_x = printer.configfile.settings.bed_mesh.mesh_max[0]|float %}
  {% set bed_max_y = printer.configfile.settings.bed_mesh.mesh_max[1]|float %}

  {% set raw_min = params.MESH_MIN|default("") %}
  {% set raw_max = params.MESH_MAX|default("") %}

  {% set use_adaptive = false %}
  {% if raw_min != "" and raw_max != "" %}
    {% if raw_min.split(',')|length == 2 and raw_max.split(',')|length == 2 %}
      {% set use_adaptive = true %}
    {% endif %}
  {% endif %}

  {% if printer['gcode_macro START_PRINT'].prepare|int == 0 %}
    {action_respond_info("not prepare.\n")}
    PRINT_PREPARE_CLEAR
    CX_ROUGH_G28 EXTRUDER_TEMP={extruder_temp} BED_TEMP={bed_temp}
    CX_NOZZLE_CLEAR
    ACCURATE_G28

    {% if use_adaptive %}
      {% set min_parts = raw_min.split(',') %}
      {% set max_parts = raw_max.split(',') %}

      {% set min_x = min_parts[0]|float %}
      {% set min_y = min_parts[1]|float %}
      {% set max_x = max_parts[0]|float %}
      {% set max_y = max_parts[1]|float %}

      # Clamp to Klipper bed_mesh bounds
      {% if min_x < bed_min_x %}{% set min_x = bed_min_x %}{% endif %}
      {% if min_y < bed_min_y %}{% set min_y = bed_min_y %}{% endif %}
      {% if max_x > bed_max_x %}{% set max_x = bed_max_x %}{% endif %}
      {% if max_y > bed_max_y %}{% set max_y = bed_max_y %}{% endif %}

      # Ensure min < max with at least a 10 mm span
      {% if max_x - min_x < 10 %}
        {% set min_x = bed_min_x %}
        {% set max_x = bed_min_x + 10 %}
        {% if max_x > bed_max_x %}{% set max_x = bed_max_x %}{% endif %}
      {% endif %}
      {% if max_y - min_y < 10 %}
        {% set min_y = bed_min_y %}
        {% set max_y = bed_min_y + 10 %}
        {% if max_y > bed_max_y %}{% set max_y = bed_max_y %}{% endif %}
      {% endif %}

      # PROBE_COUNT intentionally omitted: PRTouch wrapper requires the
      # fixed 5x5 count from [bed_mesh]. The BED_MESH_CALIBRATE wrapper
      # would strip it anyway, but we do not pass it at all.
      RESPOND TYPE=command MSG="Adaptive mesh: X {min_x}-{max_x} Y {min_y}-{max_y} (5x5 fixed)"
      BED_MESH_CLEAR
      BED_MESH_CALIBRATE MESH_MIN={min_x},{min_y} MESH_MAX={max_x},{max_y}
      BED_MESH_OUTPUT
    {% else %}
      {action_respond_info("Full bed mesh via CX_PRINT_LEVELING_CALIBRATION")}
      CX_PRINT_LEVELING_CALIBRATION
    {% endif %}
  {% else %}
    PRINT_PREPARE_CLEAR
  {% endif %}

  # ============================================================
  # Re-apply the user-tuned gcode Z-offset.
  # ============================================================
  ZOFFSET_RESTORE

  # ============================================================
  # HEAT #2: Re-heat to print temperature before the purge line.
  # ============================================================
  RESPOND TYPE=command MSG="Re-heating hotend to {extruder_temp}C for purge..."
  M109 S{extruder_temp}

  _CUSTOM_PURGE_LINE

[gcode_macro PRINT_PREPARED]
gcode:
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=prepare VALUE=1
  {action_respond_info("print prepared")}

[gcode_macro PRINT_PREPARE_CLEAR]
gcode:
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=prepare VALUE=0

[gcode_macro END_PRINT_POINT_WITHOUT_LIFTING]
gcode:
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-1.0 F180
      G1 E-{E} F4000
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    G1 Z2.0 F600
    G90
    {% set y_park = printer.toolhead.axis_maximum.y/2 %}
    {% set x_park = printer.toolhead.axis_maximum.x|float - 10.0 %}
    G1 X{x_park} Y{y_park} F30000
  {% else %}
    {action_respond_info("end print xyz_axes is NULL\n")}
  {% endif %}

[gcode_macro END_PRINT_POINT]
gcode:
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    {% set max_z = printer["gcode_macro PRINTER_PARAM"].max_z_position|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set z_safe = 0.0 %}
    {% if act_z < (max_z / 2) %}
      {% set z_safe = (max_z / 2) - act_z %}
    {% elif act_z < max_z %}
      {% set z_safe = 2.0 %}
    {% endif %}
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-1.0 F180
      G1 E-{E} F4000
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    G1 Z2.0 F600
    G90
    {% set y_park = printer.toolhead.axis_maximum.y/2 %}
    {% set x_park = printer.toolhead.axis_maximum.x|float - 10.0 %}
    G1 X{x_park} Y{y_park} F30000
    {% if z_safe > 2.0 %}
      G91
      {% set z_safe = z_safe - 2.0 %}
      G1 Z{z_safe} F600
      G90
    {% endif %}
  {% else %}
    {action_respond_info("end print xyz_axes is NULL\n")}
  {% endif %}

# =============================================================================
# END_PRINT - called by OrcaSlicer's machine_end_gcode.
# =============================================================================
[gcode_macro END_PRINT]
gcode:
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=m600_state VALUE=0
  Qmode_exit
  EXCLUDE_OBJECT_RESET
  PRINT_PREPARE_CLEAR
  RESPOND TYPE=command MSG="action:prompt_end"
  M220 S100
  SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=2500
  TURN_OFF_HEATERS
  ; Stop chamber exhaust fan and disable the auto-controller.
  SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN_CONTROL VARIABLE=enabled VALUE=0
  SET_PIN PIN=fan1 VALUE=0
  M107 P1
  M107 P2
  END_PRINT_POINT
  WAIT_TEMP_START
  M84

[gcode_macro FIRST_FLOOR_PAUSE]
description: Pause the first floor print
variable_extrude: 2.0
gcode:
  {% set E = printer["gcode_macro FIRST_FLOOR_PAUSE"].extrude|float %}
  {% set y_park = printer.toolhead.axis_maximum.y/2 %}
  {% set x_park = printer.toolhead.axis_maximum.x|float - 10.0 %}
  {% set max_z = printer["gcode_macro PRINTER_PARAM"].max_z_position|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% set z_safe = 0.0 %}
  {% if act_z < (max_z - 2.0) %}
    {% set z_safe = 2.0 %}
  {% elif act_z < max_z %}
    {% set z_safe = max_z - act_z %}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=z_safe_pause VALUE={z_safe|float}
  PAUSE_BASE
  G91
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-1.0 F180
      G1 E-{E} F4000
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    G1 Z{z_safe} F600
    G90
    G1 X{x_park} Y{y_park} F30000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=fan2_speed VALUE={printer['output_pin fan2'].value}
  {% set fspeed = printer['gcode_macro PRINTER_PARAM'].fan2_speed %}
  {action_respond_info("fan2_value = %s \n" % (fspeed))}
  M106 P2 S0
  SET_E_MIN_CURRENT

[gcode_macro FIRST_FLOOR_RESUME]
description: Resume the first floor print
gcode:
  RESTORE_E_CURRENT
  {% if printer['gcode_macro PRINTER_PARAM'].fan2_speed > 0 %}
    {% set s_value = (printer['gcode_macro PRINTER_PARAM'].fan2_speed * 255 - printer['gcode_macro PRINTER_PARAM'].fan2_min) * 255 / (255 - printer['gcode_macro PRINTER_PARAM'].fan2_min)|float %}
    M106 P2 S{s_value}
  {% endif %}
  {% set E = printer["gcode_macro FIRST_FLOOR_PAUSE"].extrude|float + 1.0 %}
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY) %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  M400
  RESUME_BASE {get_params}

# =============================================================================
# PAUSE - normal user pause.
# =============================================================================
[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
variable_extrude: 2.0
gcode:
  {% if printer["gcode_macro M600"].m600_state == 1 %}
    RESPOND TYPE=command MSG="Filament change in progress - use RESUME or CANCEL PRINT on the M600 prompt."
    M118 Filament change in progress - use the M600 prompt to Resume or Cancel.
  {% else %}
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    {% set y_park = printer.toolhead.axis_maximum.y/2 %}
    {% set x_park = printer.toolhead.axis_maximum.x|float - 10.0 %}
    {% set max_z = printer["gcode_macro PRINTER_PARAM"].max_z_position|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set z_safe = 0.0 %}
    {% if act_z < 48.0 %}
      {% set z_safe = 50.0 - act_z %}
    {% elif act_z < (max_z - 2.0) %}
      {% set z_safe = 2.0 %}
    {% elif act_z < max_z %}
      {% set z_safe = max_z - act_z %}
    {% endif %}
    {action_respond_info("z_safe = %s"% (z_safe))}
    SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=z_safe_pause VALUE={z_safe|float}
    PAUSE_BASE
    G91
    SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=hotend_temp VALUE={printer.extruder.target}
    M104 S140
    {% if "xyz" in printer.toolhead.homed_axes %}
      {% if printer.extruder.can_extrude|lower == 'true' %}
        G1 E-1.0 F180
        G1 E-{E} F4000
      {% else %}
        {action_respond_info("Extruder not hot enough")}
      {% endif %}
      G1 Z{z_safe} F600
      M400
      G90
      G1 X{x_park} Y{y_park} F30000
    {% else %}
      {action_respond_info("Printer not homed")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=fan2_speed VALUE={printer['output_pin fan2'].value}
    {% set fspeed = printer['gcode_macro PRINTER_PARAM'].fan2_speed %}
    {action_respond_info("fan2_value = %s \n" % (fspeed))}
    M106 P2 S0
    SET_E_MIN_CURRENT
  {% endif %}

[gcode_macro INPUTSHAPER]
gcode:
  SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
  G90
  G28
  {% set POSITION_X = printer.configfile.settings['stepper_x'].position_max/2 %}
  {% set POSITION_Y = printer.configfile.settings['stepper_y'].position_max/2 %}
  G1 X{POSITION_X} Y{POSITION_Y} F6000
  G1 Z10 F600
  SHAPER_CALIBRATE AXIS=y
  CXSAVE_CONFIG
  SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1

[gcode_macro BEDPID]
gcode:
  PID_CALIBRATE HEATER=heater_bed TARGET=100
  SAVE_CONFIG

[gcode_macro TUNOFFINPUTSHAPER]
gcode:
  SET_INPUT_SHAPER SHAPER_FREQ_X=0 SHAPER_FREQ_Y=0

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  END_PRINT
  CANCEL_PRINT_BASE

# =============================================================================
# G29 - full bed mesh helper. Called manually from the console or by GuppyScreen.
#
# PRTouch constraint: PROBE_COUNT is NOT passed. The BED_MESH_CALIBRATE
# wrapper below also strips it defensively, but G29 does not supply it at all.
# Run bare "G29".
# =============================================================================
[gcode_macro G29]
description: Full bed mesh (fixed 5x5 from [bed_mesh], PROBE_COUNT ignored)
gcode:
  # Warn if someone tries to pass PROBE_COUNT anyway.
  {% if 'PROBE_COUNT' in params|upper %}
    RESPOND TYPE=command MSG="G29: PROBE_COUNT ignored. PRTouch uses the fixed [bed_mesh] probe_count. Run bare G29."
  {% endif %}

  {% set bed_temp = printer.custom_macro.default_bed_temp %}
  {% set extruder_temp = printer.custom_macro.g28_ext_temp %}
  {% set nozzle_clear_temp = printer.custom_macro.default_extruder_temp %}

  {% if 'BED_TEMP' in params|upper %}
    {% set bed_temp = params.BED_TEMP %}
  {% endif %}

  {% if 'EXTRUDER_TEMP' in params|upper %}
    {% set nozzle_clear_temp = params.EXTRUDER_TEMP %}
  {% endif %}

  SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0

  G28
  BED_MESH_CLEAR
  NOZZLE_CLEAR HOT_MIN_TEMP={extruder_temp} HOT_MAX_TEMP={nozzle_clear_temp} BED_MAX_TEMP={bed_temp}
  ACCURATE_G28
  M204 S5000
  SET_VELOCITY_LIMIT ACCEL_TO_DECEL=5000

  # PROBE_COUNT intentionally omitted. Klipper uses [bed_mesh] probe_count: 5,5.
  BED_MESH_CALIBRATE
  BED_MESH_OUTPUT

  {% set y_park = printer.toolhead.axis_maximum.y/2 %}
  {% set x_park = printer.toolhead.axis_maximum.x|float - 10.0 %}
  G1 X{x_park} Y{y_park} F2000
  CXSAVE_CONFIG
  TURN_OFF_HEATERS
  SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1

# =============================================================================
# BED_MESH_CALIBRATE wrapper
#
# Intercepts every call to BED_MESH_CALIBRATE and strips PROBE_COUNT.
# See the PRTouch bed mesh constraint block at the top of this file for the
# full explanation. Original command is renamed to _BED_MESH_CALIBRATE_ORIG
# using the underscore-prefixed convention (dots are not allowed in named
# commands — only in M-code sub-indexes).
# =============================================================================
[gcode_macro BED_MESH_CALIBRATE]
description: Bed mesh calibrate (PROBE_COUNT stripped for PRTouch)
rename_existing: _BED_MESH_CALIBRATE_ORIG
gcode:
  {% set ns = namespace(args=[]) %}

  {% for p in params %}
    {% if p|upper != 'PROBE_COUNT' %}
      {% set ns.args = ns.args + ['%s=%s' % (p, params[p])] %}
    {% endif %}
  {% endfor %}

  {% if 'PROBE_COUNT' in params|upper %}
    RESPOND TYPE=command MSG="BED_MESH_CALIBRATE: PROBE_COUNT ignored. PRTouch uses the fixed [bed_mesh] probe_count."
  {% endif %}

  _BED_MESH_CALIBRATE_ORIG {ns.args|join(' ')}

[gcode_macro GUPPY_SKEW_CALIBRATE]
description: Skew calibration helper - prints a test object, then measures XY skew
gcode:
  RESPOND TYPE=command MSG="Skew calibration: print the CaliFlower or Klipper skew test object, then measure AC, BD, and AD with calipers."
  RESPOND TYPE=command MSG="Then run: SKEW_APPLY_AND_SAVE AC=... BD=... AD=..."

[gcode_macro SKEW_APPLY_AND_SAVE]
description: Calibrate skew from measured lengths and persist the profile
gcode:
  {% set ac = params.AC|default(0)|float %}
  {% set bd = params.BD|default(0)|float %}
  {% set ad = params.AD|default(0)|float %}
  {% if ac == 0 or bd == 0 or ad == 0 %}
    { action_raise_error("Provide AC=, BD=, AD= measured lengths in mm (e.g. SKEW_APPLY_AND_SAVE AC=139.5 BD=140.2 AD=99.8)") }
  {% endif %}
  SKEW_CORRECTION_CALIBRATE MEASURED_AC={ac} MEASURED_BD={bd} MEASURED_AD={ad}
  SKEW_PROFILE SAVE=default
  SAVE_CONFIG
  RESPOND TYPE=command MSG="Skew profile 'default' saved. It will auto-load in START_PRINT."

[gcode_macro SKEW_CLEAR]
description: Remove skew correction at runtime (does not delete the saved profile)
gcode:
  SKEW_PROFILE LOAD=
  RESPOND TYPE=command MSG="Runtime skew correction cleared. Saved profile unchanged."

[gcode_macro SKEW_STATUS]
description: Report current skew profile and loaded state
gcode:
  RESPOND TYPE=command MSG="--- Skew correction status ---"
  SKEW_PROFILE