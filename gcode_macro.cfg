# =============================================================================
# gcode_macro.cfg — START_PRINT + END_PRINT + CX_NOZZLE_CLEAR
#
# REV 2026-10-14 (v2.8.0)
#   FIX #35 — Added G92 E0 at the start of START_PRINT. Resets the
#             extruder position before any moves, giving Klipper a known
#             reference for the first extrusion move.
#
#   FIX #36 — END_PRINT now wraps its retract move in SAVE_GCODE_STATE /
#             RESTORE_GCODE_STATE. Previously the macro ended with M82,
#             which left the printer in ABSOLUTE extrusion mode. If the
#             slicer was configured for RELATIVE mode (Orca default with
#             use_relative_e_distances=1), the next print's first extrusion
#             move would be interpreted as absolute and produce the
#             "Extrude only move too long (-92233720368547.766mm)" error.
#
#             With SAVE/RESTORE, whatever mode was active when END_PRINT
#             was called is preserved across the macro.
#
# Retained:
#   FIX #34 — END_PRINT calls SET_SKEW CLEAR=1.
#   FIX #33 — [gcode_macro END_PRINT] added.
#   FIX #32 — PRINT_PREPARE_CLEAR runs only in prepare==1 branch.
#   FIX #31 — Homing safety check before _CUSTOM_PURGE_LINE.
#   FIX #30 — Non-ABS/ASA chamber target = 0 (exhaust OFF).
#   FIX #18 — Defensive BED_TEMP / EXTRUDER_TEMP parsing.
#   FIX #19 — CHAMBER_TEMP auto-selection for ABS/ASA.
#   FIX #26 — in_start flag for homing_override mesh-load guard.
#   FIX #27 — params|upper replaced with direct `in params`.
#   FIX #28 — Chamber filament match uses startswith().
#   FIX #29 — Adaptive mesh MESH_MIN/MESH_MAX bounds strip brackets.
#
# WORKFLOW
#   START_PRINT (prepare == 0, normal slice)
#     0. G92 E0 (reset extruder position)
#     1. Wait for bed + hotend targets (WAIT_TEMP_END)
#     2. Heat hotend to print temp (HEAT #1)
#     3. Zero Z-offset (ZOFFSET_CLEAR)
#     4. Load skew profile
#     5. CX_ROUGH_G28 -> CX_NOZZLE_CLEAR -> ACCURATE_G28
#     6. Adaptive mesh OR full CX mesh
#     7. Restore Z-offset (ZOFFSET_RESTORE)
#     8. Homing safety check (FIX #31)
#     9. Re-heat to print temp (HEAT #2)
#    10. _CUSTOM_PURGE_LINE
#
#   END_PRINT (from OrcaSlicer Machine End G-code)
#     Heaters off -> fans off -> [save state] retract [restore state] ->
#     park -> mesh clear -> Z-offset reset -> skew clear -> steppers off
# =============================================================================

[gcode_macro START_PRINT]
variable_prepare: 0
variable_in_start: 0
gcode:
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=in_start VALUE=1

  # FIX #35 — reset extruder position to zero before any moves.
  # Protects against inherited E state from PA tuning towers, prior
  # prints, or aborted jobs.
  G92 E0

  WAIT_TEMP_END
  CLEAR_PAUSE

  # ---- FIX #18 — defensive temperature parsing -------------------------
  {% set bed_temp = printer.custom_macro.default_bed_temp|float %}
  {% if 'BED_TEMP' in params %}
    {% set raw = params.BED_TEMP|string %}
    {% set clean = raw.replace('[','').replace(']','').replace('(','').replace(')','').split(',')[0]|trim %}
    {% if clean|float > 0 %}
      {% set bed_temp = clean|float %}
    {% endif %}
  {% endif %}

  {% set extruder_temp = printer.custom_macro.default_extruder_temp|float %}
  {% if 'EXTRUDER_TEMP' in params %}
    {% set raw = params.EXTRUDER_TEMP|string %}
    {% set clean = raw.replace('[','').replace(']','').replace('(','').replace(')','').split(',')[0]|trim %}
    {% if clean|float > 0 %}
      {% set extruder_temp = clean|float %}
    {% endif %}
  {% endif %}

  {action_respond_info("START_PRINT: BED=%sC  HOTEND=%sC" % (bed_temp, extruder_temp))}

  # ---- Chamber exhaust (FIX #19 + #28 + #30) ---------------------------
  {% set ftype = params.FILAMENT_TYPE|default("")|upper %}
  {% set chamber_temp = 0 %}
  {% if 'CHAMBER_TEMP' in params %}
    {% set raw = params.CHAMBER_TEMP|string %}
    {% set clean = raw.replace('[','').replace(']','').replace('(','').replace(')','').split(',')[0]|trim %}
    {% if clean|float > 0 and clean|float < 80 %}
      {% set chamber_temp = clean|int %}
    {% endif %}
  {% endif %}
  {% if chamber_temp == 0 %}
    {% if ftype.startswith("ABS") or ftype.startswith("ASA") %}
      {% set chamber_temp = 50 %}
    {% else %}
      {% set chamber_temp = 0 %}
    {% endif %}
  {% endif %}
  {action_respond_info("Chamber fan target: %sC (filament: %s)" % (chamber_temp, ftype))}
  M141 S{chamber_temp}

  # ---- HEAT #1 ---------------------------------------------------------
  RESPOND TYPE=command MSG="Heating hotend to {extruder_temp}C before print prep..."
  M109 S{extruder_temp}

  ZOFFSET_CLEAR

  # ---- Load skew profile ----------------------------------------------
  {% if 'skew_correction default' in printer.configfile.settings %}
    SKEW_PROFILE LOAD=default
  {% endif %}

  # ---- Adaptive / full bed mesh ---------------------------------------
  {% set bed_min_x = printer.configfile.settings.bed_mesh.mesh_min[0]|float %}
  {% set bed_min_y = printer.configfile.settings.bed_mesh.mesh_min[1]|float %}
  {% set bed_max_x = printer.configfile.settings.bed_mesh.mesh_max[0]|float %}
  {% set bed_max_y = printer.configfile.settings.bed_mesh.mesh_max[1]|float %}

  {% set raw_min = params.MESH_MIN|default("")|string %}
  {% set raw_max = params.MESH_MAX|default("")|string %}
  {% set raw_min = raw_min.replace('[','').replace(']','').replace('(','').replace(')','')|trim %}
  {% set raw_max = raw_max.replace('[','').replace(']','').replace('(','').replace(')','')|trim %}

  {% set use_adaptive = false %}
  {% if raw_min != "" and raw_max != "" %}
    {% if raw_min.split(',')|length == 2 and raw_max.split(',')|length == 2 %}
      {% set use_adaptive = true %}
    {% endif %}
  {% endif %}

  {% if printer['gcode_macro START_PRINT'].prepare|int == 0 %}
    {action_respond_info("not prepare.\n")}
    CX_ROUGH_G28 EXTRUDER_TEMP={extruder_temp} BED_TEMP={bed_temp}
    CX_NOZZLE_CLEAR
    ACCURATE_G28

    {% if use_adaptive %}
      {% set min_parts = raw_min.split(',') %}
      {% set max_parts = raw_max.split(',') %}
      {% set min_x = min_parts[0]|float %}
      {% set min_y = min_parts[1]|float %}
      {% set max_x = max_parts[0]|float %}
      {% set max_y = max_parts[1]|float %}

      {% if min_x < bed_min_x %}{% set min_x = bed_min_x %}{% endif %}
      {% if min_y < bed_min_y %}{% set min_y = bed_min_y %}{% endif %}
      {% if max_x > bed_max_x %}{% set max_x = bed_max_x %}{% endif %}
      {% if max_y > bed_max_y %}{% set max_y = bed_max_y %}{% endif %}

      {% if max_x - min_x < 10 %}
        {% set min_x = bed_min_x %}
        {% set max_x = bed_min_x + 10 %}
        {% if max_x > bed_max_x %}{% set max_x = bed_max_x %}{% endif %}
      {% endif %}
      {% if max_y - min_y < 10 %}
        {% set min_y = bed_min_y %}
        {% set max_y = bed_min_y + 10 %}
        {% if max_y > bed_max_y %}{% set max_y = bed_max_y %}{% endif %}
      {% endif %}

      RESPOND TYPE=command MSG="Adaptive mesh: X {min_x}-{max_x} Y {min_y}-{max_y} (5x5 fixed)"
      BED_MESH_CLEAR
      BED_MESH_CALIBRATE MESH_MIN={min_x},{min_y} MESH_MAX={max_x},{max_y}
      BED_MESH_OUTPUT
    {% else %}
      {action_respond_info("Full bed mesh via CX_PRINT_LEVELING_CALIBRATION")}
      CX_PRINT_LEVELING_CALIBRATION
    {% endif %}
  {% else %}
    # FIX #32 — this is the ONLY place PRINT_PREPARE_CLEAR should run.
    PRINT_PREPARE_CLEAR
  {% endif %}

  ZOFFSET_RESTORE

  # ---- FIX #31 — homing safety check ----------------------------------
  {% if printer.toolhead.homed_axes != "xyz" %}
    RESPOND TYPE=command MSG="START_PRINT: axes not homed - running G28 before purge"
    G28
  {% endif %}

  # ---- HEAT #2 ---------------------------------------------------------
  RESPOND TYPE=command MSG="Re-heating hotend to {extruder_temp}C for purge..."
  M109 S{extruder_temp}

  _CUSTOM_PURGE_LINE
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=in_start VALUE=0

# =============================================================================
# END_PRINT — called by OrcaSlicer Machine End G-code
#
# REV 2026-10-14 (FIX #33, #34, #36)
#   * Heaters off (extruder, bed, chamber exhaust)
#   * Fans off (part cooling fan0, aux fan1, chamber exhaust fan2)
#   * Retract 2 mm to relieve nozzle pressure (SAVE/RESTORE mode)
#   * Lift Z and park at front-left (only if homed)
#   * Clear adaptive/full mesh so next print does a fresh calibration
#   * Reset Z-offset to 0 so the next START_PRINT starts clean
#   * Clear skew correction so manual moves are in the raw frame
#   * Release steppers (last, after all moves complete)
#
# FIX #36 — The retract block is wrapped in SAVE_GCODE_STATE /
#           RESTORE_GCODE_STATE. This preserves whatever extrusion mode
#           was active when END_PRINT was called (typically M83 relative
#           from the slicer). Previously a hard-coded M82 at the end of
#           the retract would leave the printer in ABSOLUTE mode, and the
#           next print's first relative extrusion command would compute a
#           nonsense delta and crash with "Extrude only move too long".
# =============================================================================
[gcode_macro END_PRINT]
description: Safe end-of-print cleanup
gcode:
  # 1. Kill all heaters (extruder, bed)
  TURN_OFF_HEATERS

  # 2. Idle the chamber exhaust (M141 S0 turns fan1 off, target -> 35)
  M141 S0

  # 3. Kill part-cooling and auxiliary fans
  M106 P0 S0
  M106 P1 S0
  M106 P2 S0

  # 4. Relieve nozzle pressure. SAVE/RESTORE preserves E and coordinate
  #    mode across the retract so we don't leak state into the next job.
  {% if printer.extruder.can_extrude|lower == 'true' %}
    SAVE_GCODE_STATE NAME=END_PRINT_retract
    M83
    G1 E-2 F1800
    M400
    RESTORE_GCODE_STATE NAME=END_PRINT_retract
  {% endif %}

  # 5. Lift and park (only if homed)
  {% if "xyz" in printer.toolhead.homed_axes %}
    SAVE_GCODE_STATE NAME=END_PRINT_park
    G91
    G1 Z10 F600
    M400
    G90
    G1 X10 Y10 F6000
    M400
    RESTORE_GCODE_STATE NAME=END_PRINT_park
  {% endif %}

  # 6. Clear mesh + reset Z-offset for the next print
  BED_MESH_CLEAR
  SET_GCODE_OFFSET Z=0 MOVE=0

  # 7. Clear skew so manual moves and next print start clean.
  SET_SKEW CLEAR=1

  # 8. Disable steppers (last, after all moves are done)
  M84

  RESPOND TYPE=command MSG="Print complete. Heaters off, toolhead parked, steppers released."

# =============================================================================
# CX_NOZZLE_CLEAR — safe override for the stock Creality routine
#
# Replaces the built-in CX_NOZZLE_CLEAR which can throw "Internal error".
# Uses hardcoded K1C brush coordinates. Do not use Jinja comments inside
# the gcode: block.
# =============================================================================
[gcode_macro CX_NOZZLE_CLEAR]
rename_existing: CX_NOZZLE_CLEAR_ORIGINAL
description: Safe override for nozzle cleaning
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}

  # Reset velocity and acceleration to safe defaults
  SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel}

  # Wipe parameters (K1C stock brush location)
  {% set start_x = 90 %}
  {% set start_y = 226 %}
  {% set start_z = 3.8 %}
  {% set wipe_dist = 40 %}
  {% set wipe_qty = 10 %}
  {% set wipe_spd = 250 %}
  {% set raise_distance = 15 %}

  # Move to start position
  G90
  G1 X{start_x} Y{start_y} F6000
  G1 Z{start_z} F1500

  # Perform the wipe
  {% for wipes in range(1, (wipe_qty + 1)) %}
    G1 X{start_x + wipe_dist} F{wipe_spd * 60}
    G1 X{start_x} F{wipe_spd * 60}
  {% endfor %}

  # Raise nozzle
  G1 Z{raise_distance} F1500