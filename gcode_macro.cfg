# =============================================================================
# BED_MESH_CALIBRATE wrapper
#
# Any direct call to BED_MESH_CALIBRATE — from the console, from GuppyScreen,
# from Mainsail/Fluidd, from another macro, or from a stray slicer snippet —
# is intercepted here. PROBE_COUNT is stripped before forwarding to the real
# Klipper command, because Creality's prtouch_v1_wrapper.py requires the fixed
# probe point count from [bed_mesh] probe_count: 5,5.
#
# Passing a dynamic PROBE_COUNT causes:
#   IndexError: list index out of range
# in prtouch_v1_wrapper.py bed_mesh_post_proc, surfacing as:
#   {"code":"key60","msg":"Internal error on command:BED_MESH_CALIBRATE"}
#
# All other parameters (MESH_MIN, MESH_MAX, METHOD, ALGORITHM, TENSION, etc.)
# are forwarded unchanged.
#
# NOTE: the rename target MUST NOT contain a dot. Klipper's G-code parser
# only allows dots in M-code sub-commands (M204.1, M117.2, ...). Named
# commands are restricted to [a-zA-Z_][a-zA-Z0-9_]+. Using
# "BED_MESH_CALIBRATE.1" causes:
#   {"code":"key513","msg":"Malformed command 'BED_MESH_CALIBRATE.1 ...'"}
# Hence the underscore-prefixed name below.
# =============================================================================
[gcode_macro BED_MESH_CALIBRATE]
description: Bed mesh calibrate (PROBE_COUNT stripped for PRTouch)
rename_existing: _BED_MESH_CALIBRATE_ORIG
gcode:
  {% set ns = namespace(args=[]) %}

  {% for p in params %}
    {% if p|upper != 'PROBE_COUNT' %}
      {% set ns.args = ns.args + ['%s=%s' % (p, params[p])] %}
    {% endif %}
  {% endfor %}

  {% if 'PROBE_COUNT' in params|upper %}
    RESPOND TYPE=command MSG="BED_MESH_CALIBRATE: PROBE_COUNT ignored. PRTouch uses the fixed [bed_mesh] probe_count."
  {% endif %}

  _BED_MESH_CALIBRATE_ORIG {ns.args|join(' ')}