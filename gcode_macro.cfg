# =============================================================================
# START_PRINT - entry point for every print job (called by OrcaSlicer).
#
# Flow overview:
#   1. Resolve temperatures (bed, extruder, chamber) from params or defaults.
#   2. Set chamber fan ceiling via M141.
#   3. HEAT TO PROBE TEMPERATURE (160 C) - see comment below.
#   4. ZOFFSET_CLEAR - zero live gcode Z-offset, block saves.
#   5. SKEW_PROFILE LOAD=default - apply XY shear (independent of Z).
#   6. Rough home + nozzle clean + accurate home (offset-free).
#   7. Bed mesh - adaptive via OrcaSlicer MESH_MIN/MAX, or full-bed fallback.
#   8. ZOFFSET_RESTORE - re-apply user-tuned gcode Z-offset.
#   9. HEAT TO FULL PRINT TEMPERATURE - see comment below.
#  10. Custom purge line.
# =============================================================================
[gcode_macro START_PRINT]
variable_prepare: 0
gcode:
  WAIT_TEMP_END
  CLEAR_PAUSE
  {% set g28_extruder_temp = printer.custom_macro.g28_ext_temp %}
  {% set bed_temp = printer.custom_macro.default_bed_temp %}
  {% set extruder_temp = printer.custom_macro.default_extruder_temp %}

  {% if 'BED_TEMP' in params|upper and (params.BED_TEMP|float) %}
    {% set bed_temp = params.BED_TEMP %}
  {% endif %}

  {% if 'EXTRUDER_TEMP' in params|upper and (params.EXTRUDER_TEMP|float) %}
    {% set extruder_temp = params.EXTRUDER_TEMP %}
  {% endif %}

  # ============================================================
  # Chamber exhaust fan ceiling
  # ============================================================
  {% set ftype = params.FILAMENT_TYPE|default("")|upper %}
  {% set chamber_temp = params.CHAMBER_TEMP|default(0)|int %}
  {% if chamber_temp == 0 %}
    {% if ftype in ["ABS", "ASA"] %}
      {% set chamber_temp = 50 %}
    {% else %}
      {% set chamber_temp = 35 %}
    {% endif %}
  {% endif %}
  {action_respond_info("Chamber fan target: %sC (filament: %s)" % (chamber_temp, ftype))}
  M141 S{chamber_temp}

  # ============================================================
  # HEAT TO PROBE TEMPERATURE (160 C)
  #
  # Creality's [prtouch_v2] with g28_wait_cool_down: true will
  # actively cool the nozzle before probing. To avoid that fight:
  #   * Heat only to 160 C here (10 C above min_extrude_temp so
  #     key111 cannot fire from fluctuation).
  #   * The nozzle is warm enough that the brush wipe is effective.
  #   * AFTER the mesh, we heat to the full print temperature just
  #     before the purge line.
  # ============================================================
  RESPOND TYPE=command MSG="Heating hotend to 160C for probing..."
  M109 S160

  # ============================================================
  # Suspend persisted gcode Z-offset BEFORE any movement macro runs.
  # ============================================================
  ZOFFSET_CLEAR

  # ============================================================
  # Apply skew correction profile if it exists.
  # ============================================================
  SKEW_PROFILE LOAD=default

  # ============================================================
  # Adaptive Bed Mesh: use OrcaSlicer-supplied bounds if present,
  # else fall back to full-bed CX_PRINT_LEVELING_CALIBRATION.
  # ============================================================
  {% set use_adaptive = ('MESH_MIN' in params|upper) and ('MESH_MAX' in params|upper) %}
  {% set mesh_min = params.MESH_MIN|default("5,5") %}
  {% set mesh_max = params.MESH_MAX|default("215,215") %}
  {% set probe_count = params.PROBE_COUNT|default("5,5") %}

  {% if printer['gcode_macro START_PRINT'].prepare|int == 0 %}
    {action_respond_info("not prepare.\n")}
    PRINT_PREPARE_CLEAR
    CX_ROUGH_G28 EXTRUDER_TEMP={g28_extruder_temp} BED_TEMP={bed_temp}
    CX_NOZZLE_CLEAR
    ACCURATE_G28

    {% if use_adaptive %}
      {action_respond_info("Adaptive mesh -> MIN=%s MAX=%s COUNT=%s" % (mesh_min, mesh_max, probe_count))}
      BED_MESH_CLEAR
      BED_MESH_CALIBRATE MESH_MIN={mesh_min} MESH_MAX={mesh_max} PROBE_COUNT={probe_count}
      BED_MESH_OUTPUT
    {% else %}
      {action_respond_info("Full bed mesh via CX_PRINT_LEVELING_CALIBRATION")}
      CX_PRINT_LEVELING_CALIBRATION
    {% endif %}
  {% else %}
    PRINT_PREPARE_CLEAR
  {% endif %}

  # ============================================================
  # Re-apply the user-tuned gcode Z-offset.
  # ============================================================
  ZOFFSET_RESTORE

  # ============================================================
  # HEAT TO FULL PRINT TEMPERATURE before the purge line.
  # This is the second and final temperature wait.
  # ============================================================
  RESPOND TYPE=command MSG="Heating hotend to {extruder_temp}C for print..."
  M109 S{extruder_temp}

  #CX_PRINT_DRAW_ONE_LINE
  _CUSTOM_PURGE_LINE