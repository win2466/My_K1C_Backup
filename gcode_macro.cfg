# =============================================================================
# M204 wrapper
#
# Intercepts M204 (set acceleration) and clamps its value while Qmode is
# active. The original M204 command is renamed to M204.1.
#
# WHY M204.1 AND NOT _M204_ORIG:
#   Klipper enforces that rename_existing must preserve the command "type".
#   M204 is an M-code (a numeric command). _M204_ORIG is a named command
#   (an alphabetic command). Klipper rejects cross-type renames with:
#     "G-Code macro rename of different types ('M204' vs '_M204_ORIG')"
#   The only valid rename target for an M-code is another M-code with a
#   sub-index, e.g. M204.1, M204.2, etc.
#
#   The BED_MESH_CALIBRATE wrapper DOES use _BED_MESH_CALIBRATE_ORIG because
#   BED_MESH_CALIBRATE is a named command, not an M-code. Both sides of that
#   rename are the same type, so it is accepted.
# =============================================================================
[gcode_macro M204]
rename_existing: M204.1
gcode:
    {% set get_params = "" %}
    {% set qmode_max_accel = printer['gcode_macro Qmode'].max_accel|string %}
    {% if 'S' in params|upper %}
      {% if printer['gcode_macro Qmode'].flag|int == 1 and params.S|float > qmode_max_accel|float %}
        {% set get_params = (get_params + ' ' + 'S' + qmode_max_accel) %}
      {% else %}
        {% set get_params = (get_params + ' ' + 'S' + params.S) %}
      {% endif %}
    {% endif %}
    {% if 'P' in params|upper %}
      {% if printer['gcode_macro Qmode'].flag|int == 1 and params.P|float > qmode_max_accel|float %}
        {% set get_params = (get_params + ' ' + 'P' + qmode_max_accel) %}
      {% else %}
        {% set get_params = (get_params + ' ' + 'P' + params.P) %}
      {% endif %}
    {% endif %}
    {% if 'T' in params|upper %}
      {% if printer['gcode_macro Qmode'].flag|int == 1 and params.T|float > qmode_max_accel|float %}
        {% set get_params = (get_params + ' ' + 'T' + qmode_max_accel) %}
      {% else %}
        {% set get_params = (get_params + ' ' + 'T' + params.T) %}
      {% endif %}
    {% endif %}
    M204.1 {get_params}