# K1C
# Printer_size: 220x220x250
# Version: v1.0.0
# CreateDate: 2023/09/05
# Nozzle_mcu: chip: GD32F303CBT6
#             version: CR-K1-MAX-NOZZLE-V1.2.0
# Leveling_mcu: chip: GD32E230F8P6
#             version: CR-K1-MAX-LEVELING-V1.1.0
# mcu: chip: GD32F303RET6
#      version: CR4CU220812S12

# =============================================================================
# fan_feedback - tachometer / RPM feedback inputs for the three fans.
#
# IMPORTANT: The pins here are NOT the PWM output pins. They are the
# tachometer signal inputs used by the Creality fan-feedback layer to
# read fan RPM. The PWM outputs are declared separately in [output_pin
# fanN] in printer.cfg.
#
#   Fan   | PWM output pin        | Feedback (tach) pin    | Role
#   ------|-----------------------|------------------------|--------------------
#   fan0  | nozzle_mcu:PB8        | nozzle_mcu:PB4         | throat / model fan
#   fan1  | PC0                   | PC6                    | backplane / exhaust
#   fan2  | PB1                   | (none declared)        | hotend / part fan
#
# The pins are physically distinct MCU pins. fan0 uses PB8 for PWM and
# PB4 for tach because the fan connector routes them separately. Do not
# move a pin from one role to the other without checking the schematic.
#
# The original commented line "# fan0_pin: nozzle_mcu:PB3" was the model
# fan variant; on this printer the throat fan pin (PB4) is used.
# =============================================================================
[fan_feedback]
# fan0_pin: nozzle_mcu:PB3 # model fan (unused on this config)
fan0_pin: nozzle_mcu:PB4 # throat fan - TACHOMETER INPUT (not PWM)
fan1_pin: PC6 # backplane fan - TACHOMETER INPUT (not PWM)
print_delay_time: 5
current_delay_time: 2

# =============================================================================
# custom_macro - printer-wide temperature defaults used by many macros
# =============================================================================
[custom_macro]
default_bed_temp: 50
default_extruder_temp: 240
g28_ext_temp: 140

# 产品定义参数
[gcode_macro product_param]
# 模型成型尺寸
variable_bed_size_x: 220
variable_bed_size_y: 220
variable_bed_size_z: 220
# 支持最高温度
variable_nozzle_temp: 300
variable_bed_temp: 100
variable_chamber_temp: 60
gcode: