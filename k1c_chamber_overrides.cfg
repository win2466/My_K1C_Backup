# =============================================================================
# k1c_chamber_overrides.cfg
# REV 2026-10-25 (v13.2) - simplified for reliability
# No {# #} comments inside templates. All { } expressions on one line.
# =============================================================================

[temperature_fan chamber_fan]
pin: PC0
cycle_time: 0.0100
hardware_pwm: false
max_power: 1
shutdown_speed: 0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 70
control: watermark
max_delta: 2
target_temp: 70.0
max_speed: 1.0
min_speed: 0.0

[gcode_macro _K1C_SET_CHAMBER_FAN]
description: Set K1C chamber exhaust target based on filament type
gcode:
    {% set ftype = params.FILAMENT_TYPE|default("")|upper %}
    {% set target = 35 %}
    {% set mode = "moderate" %}
    {% if "ABS" in ftype or "ASA" in ftype %}
        {% set target = 55 %}
        {% set mode = "warm" %}
    {% elif "PLA" in ftype or "TPU" in ftype %}
        {% set target = 25 %}
        {% set mode = "cool" %}
    {% endif %}
    {% if params.CHAMBER_TEMP is defined %}
        {% set override = params.CHAMBER_TEMP|int %}
        {% if override <= 0 %}
            {% set target = 70 %}
            {% set mode = "off" %}
        {% elif override <= 70 %}
            {% set target = override %}
            {% set mode = "override" %}
        {% endif %}
    {% endif %}
    {% set fdisplay = ftype if ftype else "unknown" %}
    {action_respond_info("K1C chamber fan: %s (filament=%s) target=%sC" % (mode, fdisplay, target))}
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={target}

[gcode_macro M141]
description: Chamber exhaust target (S0 = off)
gcode:
    {% if 'S' in params %}
        {% set s = params.S|int %}
        {% if s <= 0 %}
            SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET=70
            RESPOND TYPE=command MSG="Chamber fan OFF"
        {% elif s <= 70 %}
            SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={s}
            RESPOND TYPE=command MSG="Chamber fan target set"
        {% else %}
            SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET=70
            RESPOND TYPE=command MSG="Chamber fan OFF (clamped)"
        {% endif %}
    {% endif %}

[gcode_macro M191]
description: Wait for chamber temperature
gcode:
    {% if 'S' in params %}
        {% set s = params.S|float %}
        {% if s > 0 and s <= 70 %}
            {% set ct = printer["temperature_fan chamber_fan"].temperature|float %}
            {% if s > ct %}
                M140 S100
                TEMPERATURE_WAIT SENSOR="temperature_fan chamber_fan" MINIMUM={s-1}
            {% endif %}
        {% endif %}
    {% endif %}