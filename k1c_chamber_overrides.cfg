# =============================================================================
# k1c_chamber_overrides.cfg
#
# Chamber exhaust fan as a [temperature_fan]. This replaces the simple
# [output_pin fan1] that previously owned PC0. Single owner of PC0 now.
#
# Consumer macros (in printer.cfg):
#   * START_PRINT calls M141 S50 for ABS/ASA, M141 S0 for everything else.
#   * M141 S50  -> target_temp = 50  -> exhaust when chamber > 50 °C
#   * M141 S0   -> target_temp = 70  -> effectively off (max_temp is 70)
#   * M106 P1 / M106 P3 are shimmed to M141 in printer.cfg
#   * M191 waits on the passive [temperature_sensor chamber_temp] (PC5)
#
# Both [temperature_sensor chamber_temp] (in printer.cfg) and this fan read
# PC5. [duplicate_pin_override] in printer.cfg already lists PC5.
# =============================================================================

[temperature_fan chamber_fan]
pin: PC0
cycle_time: 0.0100
hardware_pwm: false
max_power: 1
shutdown_speed: 0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 70
control: watermark
max_delta: 2
target_temp: 70.0    # = max_temp -> "off". M141 overrides at print start.
max_speed: 1.0
min_speed: 0.0