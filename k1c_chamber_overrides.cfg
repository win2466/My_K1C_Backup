# =============================================================================
# k1c_chamber_overrides.cfg
# Creality K1C - Chamber exhaust fan hardware + macros
#
# Hardware: exhaust fan (PC0) controlled by a thermistor (PC5) using watermark
# control. Watermark semantics (important for understanding the mappings below):
#   * target_temp = T means the fan runs when chamber > T and stops at <= T
#   * LOW target  -> active cooling/venting
#   * HIGH target -> chamber warms passively (fan rarely runs)
#   * target 70   -> effectively OFF in normal ambient
#
# Filament-aware auto-config is provided by _K1C_SET_CHAMBER_FAN, called
# from START_PRINT with the Orca/PrusaSlicer FILAMENT_TYPE parameter.
# =============================================================================

[temperature_fan chamber_fan]
pin: PC0
cycle_time: 0.0100
hardware_pwm: false
max_power: 1
shutdown_speed: 0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 70
control: watermark
max_delta: 2
target_temp: 70.0
max_speed: 1.0
min_speed: 0.0

# -----------------------------------------------------------------------------
# _K1C_SET_CHAMBER_FAN
#
# Sets the chamber exhaust target based on filament type. Called automatically
# from START_PRINT (see printer.cfg) using Orca's FILAMENT_TYPE parameter.
#
# Manual use is also supported:
#   _K1C_SET_CHAMBER_FAN FILAMENT_TYPE=ABS
#   _K1C_SET_CHAMBER_FAN CHAMBER_TEMP=40       # explicit override wins
#   _K1C_SET_CHAMBER_FAN CHAMBER_TEMP=0        # force off
#
# Mapping (watermark mode - see header):
#   25°C -> "cool"     active venting, PLA/TPU/PVA/BVOH
#   35°C -> "moderate" vent if > 35, PETG/PET-CF and default
#   55°C -> "warm"     chamber warms from bed, ABS/ASA/PC/PA/HIPS/PPS/PEI/PEEK
#   70°C -> "off"      force via CHAMBER_TEMP=0 or M141 S0
# -----------------------------------------------------------------------------
[gcode_macro _K1C_SET_CHAMBER_FAN]
description: Configure K1C chamber exhaust fan target for a given filament
gcode:
    {% set ftype = params.FILAMENT_TYPE|default("")|upper %}

    {# Default: moderate venting (safe for unknown filaments) #}
    {% set target = 35 %}
    {% set mode = "moderate" %}

    {# Warp-prone high-temp: keep chamber warm, exhaust only if > 55C #}
    {% if ftype.startswith("ABS") or ftype.startswith("ASA")
          or ftype.startswith("PC")  or ftype.startswith("PA")
          or ftype.startswith("HIPS") or ftype.startswith("PPS")
          or ftype.startswith("PEI") or ftype.startswith("PEEK") %}
        {% set target = 55 %}
        {% set mode = "warm" %}
    {# Moderate: exhaust if chamber > 35C #}
    {% elif ftype.startswith("PETG") or ftype.startswith("PET-CF") %}
        {% set target = 35 %}
        {% set mode = "moderate" %}
    {# Low-temp: actively ventilate to keep chamber near ambient #}
    {% elif ftype.startswith("PLA") or ftype.startswith("TPU")
          or ftype.startswith("PVA") or ftype.startswith("BVOH") %}
        {% set target = 25 %}
        {% set mode = "cool" %}
    {% endif %}

    {# Explicit CHAMBER_TEMP= param overrides filament-derived target #}
    {% if params.CHAMBER_TEMP is defined %}
        {% set override = params.CHAMBER_TEMP|int %}
        {% if override <= 0 %}
            {% set target = 70 %}
            {% set mode = "off (override)" %}
        {% elif override <= 70 %}
            {% set target = override %}
            {% set mode = "override" %}
        {% endif %}
    {% endif %}

    {action_respond_info("K1C chamber fan: %s (filament=%s) target=%sC"
                          % (mode, ftype if ftype else "unknown", target))}
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={target}

# -----------------------------------------------------------------------------
# M141 - Chamber exhaust target temperature
#
# Semantics (matched to slicer expectations, not raw watermark quirks):
#   M141 S0        -> OFF (high target, fan does not run)
#   M141 S25..S70  -> direct watermark target
#   M141 S>70      -> clamped to 70 (off)
#
# Note: M106 P1 S<n> in printer.cfg maps to M141 S<n>, so slicer chamber-fan
# commands keep working as before.
# -----------------------------------------------------------------------------
[gcode_macro M141]
description: Set chamber exhaust fan target temperature (S0 = off)
gcode:
    {% if 'S' in params %}
        {% set s = params.S|int %}
        {% if s <= 0 %}
            {# Off: high target means fan never reaches #}
            SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET=70
            RESPOND TYPE=command MSG="Chamber fan: OFF"
        {% elif s <= 70 %}
            SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={s}
            RESPOND TYPE=command MSG="Chamber fan target: {s}C"
        {% else %}
            SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET=70
            RESPOND TYPE=command MSG="Chamber fan: OFF (S{s} clamped)"
        {% endif %}
    {% endif %}

# -----------------------------------------------------------------------------
# M191 - Wait for chamber to reach target temperature
# -----------------------------------------------------------------------------
[gcode_macro M191]
description: Wait for chamber temperature
gcode:
    {% if 'S' in params %}
        {% set s = params.S|float %}
        {% if s > 0 and s <= 70 %}
            {% set ct = printer["temperature_fan chamber_fan"].temperature|float %}
            {% if s > ct %}
                {# Bed must be hot for chamber to warm #}
                M140 S100
                TEMPERATURE_WAIT SENSOR="temperature_fan chamber_fan" MINIMUM={s-1}
            {% endif %}
        {% endif %}
    {% endif %}