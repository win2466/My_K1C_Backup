# =============================================================================
# custom_purge.cfg — START_PRINT purge line
#
# REV 2026-10-10
#   FIX A — Added can_extrude guard. Previously, if the hotend was cold
#           (e.g. an M109 was skipped or failed), the purge would grind
#           filament and chew the extruder gear.
#   FIX B — Added M400 before G90/G91 and M82/M83 restoration. On CoreXY,
#           the queued purge move could still be executing when the mode
#           flip landed, corrupting the axis interpretation of the tail
#           of the move.
#
# CALLED FROM: gcode_macro.cfg → START_PRINT
# =============================================================================

[gcode_macro _CUSTOM_PURGE_LINE]
description: Safe purge line that does not touch gcode offset and does not accumulate E
gcode:
  # ---- Parameters (tune to taste) ----
  {% set purge_x       = 5.0 %}
  {% set purge_y_start = 10.0 %}
  {% set purge_y_end   = 60.0 %}
  {% set purge_z       = 0.3 %}
  {% set purge_speed   = 1200 %}
  {% set purge_len     = 30.0 %}
  # -----------------------------------

  # FIX A — refuse to purge if hotend is not actually hot.
  {% if printer.extruder.can_extrude|lower != 'true' %}
    {action_raise_error("_CUSTOM_PURGE_LINE aborted: extruder not at printing temperature")}
  {% endif %}

  {% set prev_abs = printer.gcode_move.absolute_coord %}
  {% set prev_ext = printer.gcode_move.absolute_extrude %}

  G90
  M82
  G92 E0                     ; reset E so purge_len is always a fresh 30mm

  G1 Z{purge_z + 1.0} F600
  G1 X{purge_x} Y{purge_y_start} F6000
  G1 Z{purge_z} F600

  G1 X{purge_x} Y{purge_y_end} E{purge_len} F{purge_speed}
  G1 E{purge_len - 1.0} F1800

  G1 Z{purge_z + 2.0} F600

  # FIX B — drain motion queue before flipping modes.
  M400

  G92 E0                     ; critical: reset E for the print

  {% if not prev_abs %}
    G91
  {% endif %}
  {% if not prev_ext %}
    M83
  {% endif %}