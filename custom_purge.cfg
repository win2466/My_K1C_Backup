# =============================================================================
# custom_purge.cfg — Purge line executed by START_PRINT
#
# REV 2026-10-20
#   * Added a self-contained homed_axes guard. START_PRINT already homes
#     before calling this macro, but making the macro defensive means it
#     cannot be called from a half-homed state by a future caller.
#   * All other logic retained from 2026-10-14.
# =============================================================================

[gcode_macro _CUSTOM_PURGE_LINE]
description: Purge line executed at print start
gcode:
  {% if printer.extruder.can_extrude|lower != 'true' %}
    {action_raise_error("_CUSTOM_PURGE_LINE aborted: extruder not at printing temperature")}
  {% endif %}

  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("_CUSTOM_PURGE_LINE aborted: axes not homed")}
  {% endif %}

  {% set prev_abs = printer.gcode_move.absolute_coord %}
  {% set prev_ext = printer.gcode_move.absolute_extrude %}

  M400
  G90
  M82

  G92 E0
  G1 Z0.4 F600
  G1 X5.0 Y10.0 F6000
  G1 Z0.3 F600

  G1 X5.0 Y60.0 E30.0 F1200

  G1 E29.0 F1800
  G1 Z2.3 F600

  M400
  G92 E0

  {% if not prev_abs %}
    G91
  {% endif %}
  {% if not prev_ext %}
    M83
  {% endif %}