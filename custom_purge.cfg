[gcode_macro _CUSTOM_PURGE_LINE]
description: Safe purge line for modified K1C - draws along left side of bed
gcode:
  # ---- Safe purge line parameters (adjust these to taste) ----
  {% set purge_x       = params.PURGE_X|default(5)|float %}       # X position of the line (left side)
  {% set purge_y_start = params.PURGE_Y_START|default(10)|float %} # Y start of the line (front)
  {% set purge_y_end   = params.PURGE_Y_END|default(60)|float %}   # Y end of the line (back)
  {% set purge_z       = params.PURGE_Z|default(0.3)|float %}      # Z height during purge
  {% set purge_speed   = params.PURGE_SPEED|default(1200)|float %} # mm/min
  {% set purge_len     = params.PURGE_LEN|default(30)|float %}     # extrusion length (mm of filament)
  # -----------------------------------------------------------

  # Guard: never move below safe minimums
  {% set safe_x_min = 2.0 %}
  {% set safe_y_min = 2.0 %}
  {% if purge_x < safe_x_min %}
    {% set purge_x = safe_x_min %}
  {% endif %}
  {% if purge_y_start < safe_y_min %}
    {% set purge_y_start = safe_y_min %}
  {% endif %}

  SAVE_GCODE_STATE NAME=purge_state
  G90                          ; absolute positioning
  M83                          ; relative extrusion

  ; Move to start of purge line (lift first to avoid dragging)
  G1 Z{purge_z + 1.0} F600
  G1 X{purge_x} Y{purge_y_start} F6000
  G1 Z{purge_z} F600

  ; Draw the purge line with extrusion
  G1 X{purge_x} Y{purge_y_end} E{purge_len} F{purge_speed}

  ; Small retract to stop oozing
  G1 E-1.0 F1800

  ; Lift and move away
  G1 Z{purge_z + 2.0} F600

  RESTORE_GCODE_STATE NAME=purge_state