[gcode_macro _CUSTOM_PURGE_LINE]
description: Safe purge line that does not touch gcode offset
gcode:
  # ---- Parameters (tune to taste) ----
  {% set purge_x       = 5.0 %}
  {% set purge_y_start = 10.0 %}
  {% set purge_y_end   = 60.0 %}
  {% set purge_z       = 0.3 %}
  {% set purge_speed   = 1200 %}
  {% set purge_len     = 30.0 %}
  # -----------------------------------

  # Read current gcode modes so we can restore them without SAVE/RESTORE_GCODE_STATE
  {% set prev_abs = printer.gcode_move.absolute_coord %}
  {% set prev_ext = printer.gcode_move.absolute_extrude %}

  # Force absolute positioning and absolute extrusion for the purge line
  G90
  M82

  # Move to purge start (do NOT lower Z first — lift, translate, then lower)
  G1 Z{purge_z + 1.0} F600
  G1 X{purge_x} Y{purge_y_start} F6000
  G1 Z{purge_z} F600

  # Draw the purge line
  G1 X{purge_x} Y{purge_y_end} E{purge_len} F{purge_speed}

  # Retract to stop oozing
  G1 E{purge_len - 1.0} F1800

  # Lift clear of the bed
  G1 Z{purge_z + 2.0} F600

  # Restore original gcode modes
  {% if not prev_abs %}
    G91
  {% endif %}
  {% if not prev_ext %}
    M83
  {% endif %}