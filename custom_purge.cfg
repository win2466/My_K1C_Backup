[gcode_macro _CUSTOM_PURGE_LINE]
description: Instrumented purge line - prints a trace to the console
gcode:
  RESPOND TYPE=command MSG="PURGE: 01 - entered"

  {% if printer.extruder.can_extrude|lower != 'true' %}
    {action_raise_error("_CUSTOM_PURGE_LINE aborted: extruder not at printing temperature")}
  {% endif %}

  RESPOND TYPE=command MSG="PURGE: 02 - can_extrude OK"

  {% set prev_abs = printer.gcode_move.absolute_coord %}
  {% set prev_ext = printer.gcode_move.absolute_extrude %}
  RESPOND TYPE=command MSG="PURGE: 03 - prev_abs={prev_abs} prev_ext={prev_ext}"

  M400
  RESPOND TYPE=command MSG="PURGE: 04 - M400 drained"

  G90
  M82
  RESPOND TYPE=command MSG="PURGE: 05 - modes set G90/M82"

  G92 E0
  RESPOND TYPE=command MSG="PURGE: 06 - G92 E0 done"

  G1 Z0.4 F600
  RESPOND TYPE=command MSG="PURGE: 07 - Z lift done"

  G1 X5.0 Y10.0 F6000
  RESPOND TYPE=command MSG="PURGE: 08 - move to start done"

  G1 Z0.3 F600
  RESPOND TYPE=command MSG="PURGE: 09 - Z descend done"

  RESPOND TYPE=command MSG="PURGE: 10 - about to extrude 30mm"
  G1 X5.0 Y60.0 E30.0 F1200
  RESPOND TYPE=command MSG="PURGE: 11 - extrude 30mm done"

  RESPOND TYPE=command MSG="PURGE: 12 - about to retract 1mm"
  G1 E29.0 F1800
  RESPOND TYPE=command MSG="PURGE: 13 - retract done"

  G1 Z2.3 F600
  RESPOND TYPE=command MSG="PURGE: 14 - final Z lift done"

  M400
  RESPOND TYPE=command MSG="PURGE: 15 - M400 drained"

  G92 E0
  RESPOND TYPE=command MSG="PURGE: 16 - final G92 E0"

  {% if not prev_abs %}
    G91
  {% endif %}
  {% if not prev_ext %}
    M83
  {% endif %}

  RESPOND TYPE=command MSG="PURGE: 17 - complete"